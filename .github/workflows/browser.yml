name: Browser Lane

on:
  push:
    branches: [master, ver/*, feat/*]
  pull_request:
    branches: [master, ver/*, feat/*]
  workflow_dispatch:
    inputs:
      payload_tag:
        description: 'Release payload to hydrate from. Empty builds the pack from source'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  STREAM_HTTP_SRC: .siblings/stream-http/src
  DRUPFLARE_SRC: .siblings/drupflare
  ROM_SRC: .siblings/rom

jobs:
  browser:
    name: Render the Core Forms
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - name: Check Out drupflare/stream-http
        uses: actions/checkout@v7
        with:
          repository: drupflare/stream-http
          path: .siblings/stream-http
      - name: Check Out drupflare/drupflare
        uses: actions/checkout@v7
        with:
          repository: drupflare/drupflare
          path: .siblings/drupflare
      - name: Check Out drupflare/rom
        uses: actions/checkout@v7
        with:
          repository: drupflare/rom
          path: .siblings/rom
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, iconv
      - name: Cache the Restored Interpreter
        uses: actions/cache@v6
        with:
          path: .interp
          key: interp-${{ hashFiles('cdn-manifest.json') }}

      - name: Resolve the Release Payload
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_TAG: ${{ inputs.payload_tag }}
        run: |
          TAG="${PAYLOAD_TAG:-v$(jq -r .version package.json)}"
          echo "RESOLVED_TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "HAVE_PAYLOAD=1" >> "$GITHUB_ENV"
          elif [ -n "$PAYLOAD_TAG" ]; then
            echo "::error::payload_tag '$TAG' names no release on this repository" >&2
            exit 1
          else
            echo "no release '$TAG'; this lane will build the pack from source"
          fi

      - name: Resolve Drupal Version
        id: drupalver
        if: ${{ !env.HAVE_PAYLOAD }}
        run: echo "version=$(bun scripts/fetch-drupal-tree.ts --print-version)" >> "$GITHUB_OUTPUT"
      - name: Cache Drupal Tree
        if: ${{ !env.HAVE_PAYLOAD }}
        uses: actions/cache@v6
        with:
          path: drupal-src
          key: drupal-${{ steps.drupalver.outputs.version }}
      - name: Cache the Built Pack
        if: ${{ !env.HAVE_PAYLOAD }}
        uses: actions/cache@v6
        with:
          path: |
            assets/drupal
            assets/drupal-pf
            assets/drupal-sql
            assets/core
            assets/modules
            assets/themes
            assets/prefill.json
          key: pack-${{ steps.drupalver.outputs.version }}-${{ hashFiles('scripts/pack-*.ts', 'scripts/build-local.ts', 'scripts/patch-drupal.mjs', 'scripts/drupal/**', 'cdn-manifest.json') }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Hydrate the Checkout
        if: ${{ env.HAVE_PAYLOAD }}
        run: |
          if [ -n "${{ inputs.payload_tag }}" ]; then
            set -- "--tag=${{ inputs.payload_tag }}"
          else
            set --
          fi
          bun run hydrate "$@"

      - name: Build the Pack From Source
        if: ${{ !env.HAVE_PAYLOAD }}
        run: bun run build:local

      - name: Pack the Drupal Modules
        run: bun run assets:driver

      - name: Cache the Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run the Browser Lane
        run: bun run test:browser

      - name: Upload the Playwright Report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Browser Lane to Job Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Browser lane"
            echo
            if [ -n "$HAVE_PAYLOAD" ]; then
              echo "Hydrated from \`$RESOLVED_TAG\` and drove chromium against a real worker."
            else
              echo "No release at \`$RESOLVED_TAG\`, so the pack was built from source with"
              echo "\`bun run build:local\` and chromium drove a real worker against it."
              echo
              echo "A source-built pack is a superset of a shipped one: the file list comes from a"
              echo "traced run the checkout does not have, so the bootstrap globs every non-test file."
              echo "Larger, same contents."
            fi
            echo
            echo "A console error on any page fails the lane; the vitest e2e project cannot see one."
          } >> "$GITHUB_STEP_SUMMARY"
