<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title><!-- title --></title>
		<meta
			name="description"
			content="<!-- description -->"
		/>
		<link
			rel="icon"
			href="<!-- base -->drupflare.ico"
			sizes="any"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="128x128"
			href="<!-- base -->drupflare_128.png"
		/>
		<link
			rel="apple-touch-icon"
			href="<!-- base -->drupflare_128.png"
		/>
		<link
			rel="canonical"
			href="https://docs.drupflare.com/<!-- file -->"
		/>
		<meta
			property="og:type"
			content="website"
		/>
		<meta
			property="og:site_name"
			content="Drupflare"
		/>
		<meta
			property="og:url"
			content="https://docs.drupflare.com/<!-- file -->"
		/>
		<meta
			property="og:title"
			content="<!-- title -->"
		/>
		<meta
			property="og:description"
			content="<!-- description -->"
		/>
		<meta
			property="og:image"
			content="https://docs.drupflare.com/drupflare.png"
		/>
		<style>
			:root {
				color-scheme: light dark;
				--fg: #1a1510;
				--muted: #6a5f52;
				--bg: #fffdfa;
				--card: #ffffff;
				--line: #ece3d8;
				--accent: #c2540a;
				--accent-strong: #f07a1a;
				--glow: color-mix(in oklab, #f07a1a 18%, transparent);
				--code-bg: #f8f2ea;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--fg: #f3ede5;
					--muted: #b0a494;
					--bg: #100d09;
					--card: #181410;
					--line: #2c251c;
					--accent: #ff9a3c;
					--accent-strong: #ff8a1f;
					--glow: color-mix(in oklab, #ff8a1f 22%, transparent);
					--code-bg: #1d1812;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 0 1.5rem 6rem;
				background:
					radial-gradient(60rem 30rem at 50% -10rem, var(--glow), transparent 70%),
					var(--bg);
				color: var(--fg);
				font:
					16px/1.7 ui-sans-serif,
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					sans-serif;
			}
			.layout,
			.site .bar,
			footer {
				max-width: 78rem;
				margin: 0 auto;
			}
			main {
				min-width: 0;
				max-width: 52rem;
			}
			main:focus {
				outline: none;
			}
			.docs-skip {
				position: absolute;
				left: 1rem;
				top: -4rem;
				z-index: 30;
				padding: 0.5rem 1rem;
				border-radius: 0.5rem;
				background: var(--card);
				color: var(--accent);
			}
			.docs-skip:focus {
				top: 0.5rem;
			}
			.docs-sr {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}
			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			.site {
				margin: 0 -1.5rem 3rem;
				padding: 0.75rem 1.5rem;
				border-bottom: 1px solid var(--line);
			}
			.site .bar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.25rem 1.25rem;
			}
			.site .brand {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				margin-right: auto;
				font-weight: 700;
				letter-spacing: -0.01em;
			}
			.site .brand img {
				width: 1.75rem;
				height: 1.75rem;
			}
			.site a {
				color: var(--muted);
				font-size: 0.925rem;
				text-decoration: none;
			}
			.site a:hover,
			.site a[aria-current] {
				color: var(--accent);
			}
			.site a.brand {
				color: var(--fg);
				font-size: 1.05rem;
			}
			.site .menu {
				position: relative;
			}
			.site .menu summary {
				color: var(--muted);
				font-size: 0.925rem;
				list-style: none;
				cursor: pointer;
			}
			.site .menu summary::-webkit-details-marker {
				display: none;
			}
			.site .menu summary::after {
				content: ' \25BE';
				font-size: 0.75em;
			}
			.site .menu summary:hover,
			.site .menu[open] summary,
			.site .menu[data-current] summary {
				color: var(--accent);
			}
			.site .menu .panel {
				position: absolute;
				z-index: 10;
				top: 1.9rem;
				left: -0.75rem;
				display: flex;
				flex-direction: column;
				min-width: 12rem;
				padding: 0.5rem;
				border: 1px solid var(--line);
				border-radius: 0.7rem;
				background: var(--card);
				box-shadow: 0 0.75rem 2rem var(--glow);
			}
			.site .menu .panel a {
				padding: 0.4rem 0.75rem;
				border-radius: 0.4rem;
			}
			.site .menu .panel a:hover {
				background: var(--code-bg);
			}
			.docs-menu,
			.docs-close {
				padding: 0.3rem 0.8rem;
				border: 1px solid var(--line);
				border-radius: 0.5rem;
				background: var(--card);
				color: var(--fg);
				font: inherit;
				font-size: 0.9rem;
				cursor: pointer;
			}
			.docs-sidebar {
				inset: 0 auto 0 0;
				width: min(22rem, 88vw);
				height: 100%;
				max-height: none;
				margin: 0;
				padding: 1rem 1.25rem 2rem;
				border: 0;
				border-right: 1px solid var(--line);
				overflow-y: auto;
				background: var(--card);
				color: var(--fg);
			}
			.docs-sidebar::backdrop {
				background: rgb(0 0 0 / 0.45);
			}
			.docs-sidebar-head {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 1rem;
				font-weight: 700;
			}
			.docs-nav details {
				margin: 0;
			}
			.docs-nav summary {
				padding: 0.35rem 0;
				list-style: none;
				cursor: pointer;
			}
			.docs-nav summary::-webkit-details-marker {
				display: none;
			}
			.docs-nav summary::before {
				content: '\25B8';
				display: inline-block;
				width: 1rem;
				color: var(--muted);
				font-size: 0.8rem;
			}
			.docs-nav details[open] > summary::before {
				content: '\25BE';
			}
			.docs-group > summary {
				margin-top: 0.5rem;
				color: var(--muted);
				font-size: 0.8rem;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}
			.docs-section {
				margin-left: 0.75rem;
			}
			.docs-section > summary {
				font-size: 0.9rem;
				font-weight: 600;
			}
			.docs-nav ul {
				margin: 0 0 0.5rem;
				padding: 0 0 0 1rem;
				list-style: none;
			}
			.docs-nav li {
				margin: 0;
			}
			.docs-nav li a {
				display: block;
				padding: 0.25rem 0.6rem;
				border-left: 2px solid var(--line);
				color: var(--muted);
				font-size: 0.9rem;
				line-height: 1.4;
				text-decoration: none;
			}
			.docs-nav li a:hover {
				color: var(--accent);
			}
			.docs-nav li a[aria-current] {
				border-left-color: var(--accent-strong);
				color: var(--accent);
				font-weight: 600;
			}
			.docs-nav .docs-ext::after {
				content: ' \2197';
				font-size: 0.8em;
			}
			.docs-desc {
				display: block;
				padding: 0 0.6rem 0.4rem;
				border-left: 2px solid var(--line);
				color: var(--muted);
				font-size: 0.78rem;
				line-height: 1.4;
			}
			@media (min-width: 64rem) {
				.layout {
					display: grid;
					grid-template-columns: 17rem minmax(0, 1fr);
					gap: 3rem;
				}
				.docs-menu,
				.docs-close {
					display: none;
				}
				.docs-sidebar {
					position: sticky;
					top: 1.5rem;
					display: block;
					inset: auto;
					align-self: start;
					width: auto;
					height: auto;
					max-height: calc(100vh - 3rem);
					padding: 0 0.5rem 1rem 0;
					border: 0;
					background: transparent;
				}
				.docs-sidebar-head {
					display: none;
				}
			}
			@media (prefers-reduced-motion: no-preference) and (max-width: 63.99rem) {
				.docs-sidebar {
					transform: translateX(-100%);
					transition:
						transform 0.2s ease,
						overlay 0.2s allow-discrete,
						display 0.2s allow-discrete;
				}
				.docs-sidebar:popover-open {
					transform: none;
				}
				@starting-style {
					.docs-sidebar:popover-open {
						transform: translateX(-100%);
					}
				}
			}
			@media (prefers-reduced-motion: reduce) {
				* {
					transition: none !important;
					animation: none !important;
				}
			}
			.docs-pager {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
				gap: 0.85rem;
				margin: 3rem 0 0;
			}
			.docs-pager a {
				display: block;
				padding: 0.85rem 1.1rem;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
				background: var(--card);
				color: inherit;
				text-decoration: none;
			}
			.docs-pager a:hover {
				border-color: var(--accent-strong);
			}
			.docs-pager-next {
				text-align: right;
			}
			.docs-pager .docs-pager-label {
				display: block;
				color: var(--accent);
				font-size: 0.78rem;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}
			.docs-pager strong {
				display: block;
			}
			.docs-pager a > span:last-child {
				color: var(--muted);
				font-size: 0.85rem;
				line-height: 1.45;
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 2.5rem;
				letter-spacing: -0.03em;
			}
			.badges {
				display: flex;
				flex-wrap: wrap;
				gap: 0.4rem;
				margin: 0 0 2rem;
			}
			.badges img {
				vertical-align: middle;
			}
			.links {
				display: grid;
				gap: 0.85rem;
				grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
				margin: 0 0 1.5rem;
			}
			h2.group {
				margin: 2rem 0 0.75rem;
				color: var(--muted);
				font-size: 0.95rem;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}
			a.card {
				display: block;
				padding: 1rem 1.25rem;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
				background: var(--card);
				color: inherit;
				text-decoration: none;
				transition:
					border-color 0.15s,
					box-shadow 0.15s;
			}
			a.card:hover {
				border-color: var(--accent-strong);
				box-shadow: 0 0 36px -10px var(--glow);
			}
			a.card strong {
				display: block;
				font-size: 1.02rem;
			}
			a.card span {
				color: var(--muted);
				font-size: 0.875rem;
				line-height: 1.5;
			}

			.readme {
				overflow-wrap: break-word;
			}
			.readme h1 {
				margin: 0 0 1.25rem;
			}
			.readme h2 {
				margin: 3rem 0 1rem;
				padding-bottom: 0.4rem;
				border-bottom: 1px solid var(--line);
				font-size: 1.55rem;
				letter-spacing: -0.01em;
			}
			.readme h3 {
				margin: 2rem 0 0.75rem;
				font-size: 1.2rem;
			}
			.readme a {
				color: var(--accent);
				text-underline-offset: 0.2em;
			}
			.readme hr {
				margin: 3rem 0;
				border: 0;
				border-top: 1px solid var(--line);
			}
			.readme blockquote {
				margin: 1.5rem 0;
				padding: 0.25rem 0 0.25rem 1.25rem;
				border-left: 3px solid var(--accent-strong);
				color: var(--muted);
			}
			.readme ul,
			.readme ol {
				padding-left: 1.4rem;
			}
			.readme li {
				margin: 0.35rem 0;
			}
			.readme li::marker {
				color: var(--accent-strong);
			}
			.readme .toc {
				margin: 1.5rem 0 2rem;
				padding: 1rem 1.25rem;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
				background: var(--card);
			}
			.readme .crumbs {
				margin: -1.5rem 0 1.5rem;
				color: var(--muted);
				font-size: 0.875rem;
			}
			.readme .toc ol {
				columns: 2 15rem;
				margin: 0.5rem 0 0;
			}
			.readme code {
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			}
			.readme :not(pre) > code {
				padding: 0.15em 0.4em;
				border-radius: 0.35rem;
				background: var(--code-bg);
				font-size: 0.85em;
				overflow-wrap: anywhere;
			}
			.readme pre {
				margin: 1.25rem 0;
				padding: 1rem 1.25rem;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
				overflow-x: auto;
				background: var(--code-bg);
				font-size: 0.85rem;
				line-height: 1.6;
			}
			.readme pre code {
				display: block;
			}

			.readme .shiki,
			.readme .shiki span {
				color: var(--shiki-light);
				background-color: var(--shiki-light-bg);
			}
			@media (prefers-color-scheme: dark) {
				.readme .shiki,
				.readme .shiki span {
					color: var(--shiki-dark);
					background-color: var(--shiki-dark-bg);
				}
			}

			.readme .table {
				overflow-x: auto;
				margin: 1.25rem 0;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
			}
			.readme table {
				width: 100%;
				border-collapse: collapse;
				font-size: 0.925rem;
			}
			.readme th,
			.readme td {
				padding: 0.55rem 0.9rem;
				border-bottom: 1px solid var(--line);
				text-align: left;
				vertical-align: top;
			}
			.readme th {
				background: var(--code-bg);
				font-weight: 600;
				white-space: nowrap;
			}
			.readme tbody tr:last-child td {
				border-bottom: 0;
			}
			.readme p img {
				max-width: 100%;
				vertical-align: middle;
			}
			.readme .docs-render {
				margin: 1.25rem 0;
				overflow-x: auto;
				text-align: center;
			}
			.readme .docs-render svg {
				max-width: 100%;
				height: auto;
			}
			.readme details {
				margin: 1.25rem 0;
				padding: 0.25rem 1.25rem;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
				background: var(--card);
			}
			.readme summary {
				margin: 0.5rem 0;
				font-weight: 600;
				cursor: pointer;
			}

			footer {
				margin-top: 4rem;
				padding-top: 1.5rem;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 0.9rem;
			}
			footer a {
				color: inherit;
			}
		</style>
	</head>
	<body>
		<a
			class="docs-skip"
			href="#docs-main"
			>Skip to content</a
		>
		<header class="site">
			<div class="bar">
				<button
					type="button"
					class="docs-menu"
					popovertarget="docs-sidebar"
				>
					Menu
				</button>
				<a
					class="brand"
					href="<!-- base -->index.html"
				>
					<img
						src="<!-- base -->drupflare_128.png"
						alt=""
					/>
					Drupflare
				</a>
				<!-- nav -->
			</div>
		</header>
		<div class="layout">
			<!-- sidebar -->
			<main
				id="docs-main"
				tabindex="-1"
			>
				<!-- hero -->
				<div class="readme">
					<!-- readme -->
				</div>
				<!-- pager -->
			</main>
		</div>
		<footer>
			<a href="https://github.com/drupflare/worker">github.com/drupflare/worker</a>
		</footer>
		<script
			src="<!-- base -->render.js"
			defer
		></script>
	</body>
</html>
