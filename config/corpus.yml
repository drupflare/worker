  - id: strawberryfield
    repo: https://github.com/esmero/strawberryfield
    sha: 95129453b7ad8d422670a1c8723fdea31ad911b0
    shape: module
    core: '^10.3 || ^11'
    install: modify
    modules: [strawberryfield]
    assessment: structural
    needs: [sleep, exec, background-workers]
    force: [frictionlessdata/datapackage]
    notes:
      install: >-
        upstream conflict: frictionlessdata/datapackage dev-main requires justinrainbow/json-schema
        ^5.2, and drupal/core-recommended pins ~6.8.2, so a native Drupal 11 site on
        core-recommended cannot resolve it either; it is installed past the check and runs against
        the shipped 6.8.2; enabling it is a fatal on any Drupal 11 as
        well: its generated ProxyClass\StrawberryfieldMimeService::setMapping(array $mapping = NULL) is
        not compatible with core's ExtensionMimeTypeGuesser::setMapping(?array $mapping = null): void
  - id: fairwell
    repo: https://github.com/sealionking/fairwell-drupal
    sha: f1851b473595987b04bc3b83f45e0ec4408d7e79
    shape: modules
    core: '^10 || ^11'
    install: modify
    modules:
      [
        slow_query_monitor,
        divo_module_guard,
        book_nav,
        node_export_json_md,
        divoblog_api,
        divopal_ai_gateway,
        tts_backend
      ]
    notes:
      install: >-
        ragflow_auth is left out: its routing file names RagflowLoginController::logout(), which the
        class does not define, and enabling it leaves every later render answering 500
    assessment: needs-runtime
    needs: [foreign-database]
  - id: entity_reference_integrity
    repo: https://github.com/victorstack-ai/drupal-entity-reference-integrity
