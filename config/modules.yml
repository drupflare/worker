  drupal/search_api_solr:
    needs:
      - deferrable-outbound
    why: "Its transport is not the blocker. Measured 2026-08-24 by installing it: it pulls
      `maennchen/zipstream-php`, which declares `php-64bit`, so composer emits a
      `platform_check.php` asserting `PHP_INT_SIZE === 8`. That check used to abort every request
      before Drupal booted, taking all 56 other contrib cases with it; the shipping build is 64-bit
      as of 2026-08-25 and it now passes. With `platform-check: false` the module installs clean and
      57/57 pass: `plugin.manager.search_api_solr.connector`, `solarium.query_helper` and its four
      solr config entity types all resolve, none of them before. The transport was measured
      separately against solarium 6.4.2 and is interceptable: the default connector picks
      `extension_loaded('curl') ? new Curl() : new Http()`, this build has no curl, so it lands on
      the stream adapter, and `SolariumTransport` short-circuits that through Solarium's own
      `PreExecuteRequest` with no module change"
    lift: "`PHP_INT_SIZE` 8, from wasm64 (measured to fit at 123.00 MiB) or from
      `ZEND_ENABLE_ZVAL_LONG64` on wasm32. Disabling composer's platform check is the cheap route
      and is a product decision: the guard is right that a 64-bit path exists, since zipstream is
      there for ZIP64 offsets in the configset download, so turning it off ships an unexercised path
      site-wide to unlock one module. `SolariumTransport` is already shipped with 17 assertions in
      the sibling module's `tests/solarium-transport.php`; a file-upload extract needs a streaming
      body and is declared rather than sent empty"
    vectors:
      - runtime.int64
    verified: enabled against a real site with composer's platform check on;
      `plugin.manager.search_api_solr.connector` and `solarium.query_helper` resolve and all four
      solr config entity types (`solr_cache`, `solr_field_type`, `solr_request_handler`,
      `solr_request_dispatcher`) are registered, none of them before. The `php-64bit` constraint
      that used to abort every request before Drupal booted is satisfied by the long64 build. A Solr
      server is still an outbound dependency reached through the deferred tier, so what was asserted
      is the module installing rather than a query answering
  drupal/search_gov_results_api:
    needs: []
    why: "`SearchPageForm` GETs `https://api.gsa.gov/technology/searchgov/v2/results/i14y` through
      `http_client` while building the form for `/search`, and the results are the page. That reads
      as a refusal and is not one. Driven through the real serve path with the upstream stubbed,
      2026-09-08: the module builds its own request (`affiliate`, `access_key`, `query`, `limit`,
      `offset`), the park carries it out of the form build, and the answer arrives inside the same
      render: one trip, nothing left in the deferred queue, its form inside a full 17 KB page. It
      used to take two renders across the deferred tier and no longer does. The live upstream
      confirms the request leaves the Worker: with the rig's fake credentials `api.gsa.gov` answered
      `400 affiliate not found` from inside the render. It is `untested` because the module does
      not render what it fetched**: `processResults()` pulls each entity out of a `viewMultiple()`
      result and renders the child on its own, and `buildMultiple` is a `#pre_render` on the parent,
      so a detached child renders as an empty shell. That is an upstream defect on any Drupal 11
      site, not a property of this runtime. The project has no tagged release, and its results path
      carries several TODOs"
  drupal/seckit:
    needs: []
    why: response headers and an Origin check on a kernel subscriber, all local
    verified: enabled against a real site; its subscriber, `seckit.settings` and two routes
      appeared, none of it before. With a policy configured, an anonymous page carried
      `Content-Security-Policy`, `Strict-Transport-Security` and `Referrer-Policy`, none of which
      it sent before, and `X-Frame-Options` moved from core's SAMEORIGIN to DENY. A POST with a
      foreign `Origin` answered 403 `Access denied` and the same POST with the site's own origin
      answered 200. Not asserted. The report-uri endpoint, the JavaScript clickjacking guard and
      `Expect-CT`
  drupal/simple_sitemap:
    needs:
      - cron
    why:
      generation is a queue drained by cron, plus a filesystem write per chunk. It refused to install
      because its `hook_requirements()` calls `extension_loaded('xmlwriter')`, which is a built-in
      and cannot be shimmed, so the fix is Drupal's own `hook_requirements_alter()`, host-side,
      module unmodified
    lift:
      'shipped: `XMLWRITER_FIX` supplies the eleven methods 4.2.1 calls, byte-identical to libxml
      across eight documents including both sitemap shapes, escaping, indentation depth and the
      flush semantics a chunked generator depends on. `Requirements::requirementsAlter()` clears the
      install block only when the class is present and round-trips a document, so a build without
      the polyfill keeps the honest error'
    vectors:
      - runtime.xmlwriter
    verified:
      enabled against a real site; `simple_sitemap.generator`, `simple_sitemap.queue_worker` and
      `simple_sitemap.sitemap_writer` resolve, both `simple_sitemap` and `simple_sitemap_type` are
      registered entity types and `simple_sitemap.settings` is installed, none of it before. It was
      refused outright until the host supplied a pure-PHP `XMLWriter` and cleared its one install
      block through `hook_requirements_alter()`. `extension_loaded('xmlwriter')` is a built-in and
      cannot be shimmed
  drupal/simplesamlphp_auth:
    needs: []
    why: SAML sign-on through SimpleSAMLphp. It cannot share a composer lock with `drupal/smtp`,
      because SimpleSAMLphp 2.5 needs phpmailer 7 and smtp needs phpmailer 6, nor with
      `drupal/samlauth`, whose current release resolves robrichards/xmlseclibs 4 where SimpleSAMLphp
      2.5 needs ^3.1.5, so the contrib lane installs it in a phase after the census with both
      removed. A login needs a SimpleSAMLphp
      datastore, and every stock one is unavailable on this interpreter, so a site names
      drupflare's `Drupal\drupflare\SimpleSaml\DatabaseStore` as `store.type`
    verified:
      enabled against a real site on 4.1.0 with simplesamlphp 2.5.3.1, saml2 6.2.4 and phpmailer
      7.1.1; `simplesamlphp_auth.manager`, its two admin and login routes and
      `simplesamlphp_auth.settings` appear after the enable and none of them before. `e2e/saml.spec.ts`
      then drives a real SP-initiated login and logout against Keycloak 26.8.1 with the store named
      above. `/saml_login` redirects to the realm with an AuthnRequest, the realm signs the user in
      and answers a signed SAMLResponse, the ACS accepts it, the module creates the account and its
      `authmap` row against the NameID (`simplesamlphp_auth`, `saml-rig`, mail and name from the
      mapped attributes) and `/user` answers as that account. A request with no cookie afterwards
      is anonymous. Drupal's logout then ends the session, the `sessions` row is gone, the cookie no
      longer authenticates and the provider's session is ended. An assertion whose NameID was
      altered after signing, the same assertion delivered twice and an ACS call with no SAMLResponse each leave
      the visitor anonymous and write no `authmap` row. A site supplies only SimpleSAMLphp's own
      configuration directory (loaded with `Configuration::setConfigDir()` from a small module of its
      own), its IdP metadata and the one `store.type` line; the run's `fixtures/ssp-rig` is exactly
      that and nothing else. drupflare supplies the rest. The `/simplesaml/module.php` endpoints
      are answered from the request event, SimpleSAMLphp's `exit` is turned off through its own
      constant and its raw `Location` header becomes the response, its session is saved explicitly
      because it does that from a `header_register_callback` that never fires here, and its SAML2
      container is installed. Known costs, not hidden. SimpleSAMLphp's never-returning redirect
      methods raise a `TypeError` that Drupal logs on every login start. The AuthnRequest is signed
      and the client refuses an unsigned one; assertions are encrypted with RSA-OAEP (MGF1 key
      transport) under a SHA-1 digest, which is the only key transport SimpleSAMLphp's legacy decrypt
      path unwraps. Not covered is an IdP that sends RSA-OAEP with a SHA-256 digest (Keycloak's default),
      which that path cannot decrypt even on native PHP. The run is on `wrangler dev` with the
      contrib fixture pack, so it sits outside the hermetic gate and has not run on a deployed worker
    collides:
      - drupal/smtp
      - drupal/samlauth
    plugins:
      - simplesamlphp/composer-module-installer
      - simplesamlphp/composer-xmlprovider-installer
    sheds:
      - earth-app/strata
      - drupal/search_api_solr
      - drupal/webform
      - drupal/paragraphs
      - drupal/search_api
      - drupal/facets
      - drupal/gin
      - drupal/gin_toolbar
      - drupal/schema_metatag
  drupal/smtp:
    needs:
      - deferrable-outbound
    why: "It never needed a blocking call. It was classified `blocking-outbound` until 2026-09-08 on
      the strength of PHPMailer's implementation rather than of what the site needs.
      `MailManager::mail()` returns a bool and nothing in a render waits on delivery, so the send is
      deferrable by construction, which is the tier that ships. Measured 2026-08-20: it installs
      cleanly and `smtp.settings` lands. Measured 2026-09-08: the `SMTPMailSystem` plugin is in the
      mail manager afterwards and absent before, so the module is now `verified` on what it owns"
    lift:
      "the replacement ships and is now selected: `MailInterfaceOverride` claims `system.mail` for
      `cfw_mail` from the module, so a site that drops smtp gets a working mailer rather than
      `php_mail`, which this runtime cannot run. It is an override rather than a `settings.php`
      assignment, 2026-09-07, because the assignment named a plugin of a module that a site may not
      have enabled and every `/user/password` answered 500 with `PluginNotFoundException`; an
      override only claims the key when `drupflare` is installed, and it yields to smtp when smtp
      is. Its configuration is read from 2026-08-24. The module installs here and its socket
      never runs, so a site that filled in its relay and saved had a complete SMTP configuration
      nothing looked at, and its operator had to type the same host, port and password again as
      Worker vars. `CfwMail` passes `smtp.settings` to `cfwMail`, `mailEnvFromSite()` maps it onto
      the transport vars and the deployment's own vars still win. The settings are persisted to
      `cfw_meta` because the alarm re-resolves the transport and never sees the message. So the
      module stays blocked, as the socket refuses it, while both the capability and now the
      configuration are covered"
    verified:
      'enabled against a real site; the `SMTPMailSystem` mail plugin is in `plugin.manager.mail`
      afterwards and absent before, `smtp.settings` is installed and `smtp.config` and
      `smtp.connection_tester` resolve. Its socket never runs: `CfwMail` passes `smtp.settings` to
      the host transport, so the module supplies the configuration and the relay is dialled from JS
      between invocations'
