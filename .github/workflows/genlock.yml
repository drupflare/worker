name: Regenerate the Shipped Lock

on:
  pull_request:
    paths:
      - composer.lock
      - composer.json

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate and Push
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
        env:
          DRUPFLARE_SKIP_RESTORE: '1'
      - name: Regenerate
        run: |
          bun run gen:lock
          bunx prettier --write src/ops/shipped-lock.ts
      - name: Push If Changed
        run: |
          if git diff --quiet -- src/ops/shipped-lock.ts; then
            echo "src/ops/shipped-lock.ts already matches composer.lock"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ops/shipped-lock.ts
          git commit -m "chore: regenerate the shipped lock from composer.lock"
          git push origin HEAD:"$GITHUB_HEAD_REF"
