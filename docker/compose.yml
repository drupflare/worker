name: drupflare-worker

services:
  greenmail:
    image: greenmail/standalone:2.1.14@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=drupflare:drupflarepass@localhost -Dgreenmail.verbose'
    ports:
      - '127.0.0.1:3025:3025'
      - '127.0.0.1:3465:3465'
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/api/service/readiness || exit 1']
      interval: 3s
      timeout: 5s
      retries: 40

  postgres:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_PASSWORD: 'drupflarepass'
      POSTGRES_USER: 'drupflare'
      POSTGRES_DB: 'drupflare'
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drupflare -d drupflare']
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql@sha256:893418c8a7a34c60d2d961cc30ef136095da141478562ed2101ae3f5faba9c3f
    environment:
      MYSQL_ROOT_PASSWORD: 'drupflarepass'
      MYSQL_DATABASE: 'drupflare'
      MYSQL_USER: 'drupflare'
      MYSQL_PASSWORD: 'drupflarepass'
    ports:
      - '127.0.0.1:3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pdrupflarepass']
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    command: ['redis-server', '--requirepass', 'testpass']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'testpass', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  gitea:
    image: gitea/gitea:28.2.0@sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
    environment:
      USER_UID: '1000'
      USER_GID: '1000'
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: 'http://127.0.0.1:3300/'
      GITEA__server__HTTP_PORT: '3000'
      GITEA__server__OFFLINE_MODE: 'true'
      GITEA__server__DISABLE_SSH: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__security__ALLOWED_HOST_LIST: 'private'
      GITEA__log__LEVEL: 'Warn'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3300:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/healthz || exit 1']
      interval: 3s
      timeout: 5s
      retries: 40

  forgejo:
    image: codeberg.org/forgejo/forgejo:17@sha256:06d38310de496a10186d952bdad5ca764c153c8023ede8dfa0944c79a1dc5412
    environment:
      USER_UID: '1000'
      USER_GID: '1000'
      FORGEJO__security__INSTALL_LOCK: 'true'
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: 'http://127.0.0.1:3400/'
      FORGEJO__server__HTTP_PORT: '3000'
      FORGEJO__server__OFFLINE_MODE: 'true'
      FORGEJO__server__DISABLE_SSH: 'true'
      FORGEJO__service__DISABLE_REGISTRATION: 'true'
      FORGEJO__webhook__ALLOWED_HOST_LIST: '*'
      FORGEJO__log__LEVEL: 'Warn'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3400:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/healthz || exit 1']
      interval: 3s
      timeout: 5s
      retries: 40

  gitlab:
    profiles: ['heavy']
    image: gitlab/gitlab-ce@sha256:bb79dc86267c557fd11e7feb0cd9dd506dd02e991ecdd6cae11ca7d7e5d36fc3
    shm_size: '256m'
    environment:
      GITLAB_ROOT_PASSWORD: 'drupflare-rig-password'
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://127.0.0.1:3500'
        nginx['listen_port'] = 3500
        nginx['listen_https'] = false
        puma['worker_processes'] = 0
        sidekiq['max_concurrency'] = 5
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        registry['enable'] = false
        gitlab_pages['enable'] = false
        gitlab_kas['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['initial_root_password'] = 'drupflare-rig-password'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3500:3500'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3500/users/sign_in || exit 1']
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 240s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ['start-dev', '--import-realm', '--http-port=8081']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: 'http://127.0.0.1:8081'
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_LOG_LEVEL: 'warn'
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/drupflare-realm.json:ro
    tmpfs:
      - /tmp
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: l\r\nConnection: close\r\n\r\n" >&3 && grep -q UP <&3'
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  syslog:
    image: alpine:3.24.3@sha256:b3413572228e34bd1c9245f5565e6cd127005655e8a7899aef33d8e83255c9e6
    command:
      - sh
      - -c
      - 'apk add --no-cache socat >/dev/null && : > /tmp/syslog.log && (socat -u TCP-LISTEN:5514,fork,reuseaddr OPEN:/tmp/syslog.log,append &) && exec socat TCP-LISTEN:5515,fork,reuseaddr SYSTEM:"cat /tmp/syslog.log"'
    ports:
      - '127.0.0.1:5514:5514'
      - '127.0.0.1:5515:5515'
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '5515']
      interval: 2s
      timeout: 2s
      retries: 30
