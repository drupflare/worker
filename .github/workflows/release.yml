name: Release Project

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        description: 'Changelog to replace the auto-generated one'
      suffix:
        type: string
        description: 'Suffix to append to the version'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  STREAM_HTTP_SRC: .siblings/stream-http/src
  DRUPFLARE_SRC: .siblings/drupflare
  ROM_SRC: .siblings/rom

jobs:
  gate:
    name: Gate Suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Check Out the Pinned Siblings
        uses: ./.github/actions/siblings
        with:
          pin: 'true'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, iconv
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      # `check:driver-drift` compares the packed bytes against what composer INSTALLED, reading
      # `.composer-vendor/composer/installed.json`. Nothing in CI had ever populated that, so the
      # step could only ever report all three siblings as "composer has not installed this package"
      # and fail -- a release gate that could not pass. It passes locally, where the vendor tree
      # exists, which is why it read as the siblings being unpublished rather than as a missing step.
      - name: Install the Locked PHP Packages
        run: composer install --no-interaction --no-progress
      - name: Typecheck
        run: bun run typecheck
      - name: Check Prettier Formatting
        run: bun run prettier:check
      - name: Pack the Drupal Modules
        run: bun run assets:driver
      - name: Check the Packed Modules Against the Published Versions
        run: bun run check:driver-drift
      - name: Run Vitest Suites
        run: bun run test

  payload:
    name: Build and Verify the Release Payload
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: gate

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Check Out the Pinned Siblings
        uses: ./.github/actions/siblings
        with:
          pin: 'true'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, iconv
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Read the Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field; the tag would be 'vundefined'." >&2
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "TAG=v${VERSION}${{ github.event.inputs.suffix }}"
            echo "PAYLOAD=drupflare-worker-${VERSION}.tar.gz"
            echo "BUNDLE=drupflare-managed-bundle-${VERSION}.tar.gz"
            echo "BOX=drupflare-box-bundle-${VERSION}.tar.gz"
          } >> "$GITHUB_ENV"
      - name: Resolve Drupal Version
        id: drupalver
        run: |
          version=$(bun scripts/fetch-drupal-tree.ts --print-version)
          test -n "$version" || { echo "::error::no Drupal version resolved" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Drupal Tree
        uses: actions/cache@v6
        with:
          path: drupal-src
          key: drupal-${{ steps.drupalver.outputs.version }}-${{ hashFiles('composer.lock') }}
      - name: Build the Packs
        run: bun run build:local
      - name: Build the Payload
        run: bun run release:payload
      - name: Check the Payload Against Its Own Sums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Hydrate the Checkout
        # --force, or the checks below verify nothing. `build:local` above leaves every marker
        # present, so hydrate takes its "already hydrated; nothing to do" exit and the smoke then
        # runs against the BUILT tree rather than the payload -- a check passing against a copy the
        # artifact does not contain. --force reaches the payload route, which overwrites.
        run: bun scripts/hydrate.ts --force --from="dist/$PAYLOAD"
      - name: Price the Bundle Against the Free Ceiling
        run: |
          set -o pipefail
          bun run release:check | tee /tmp/bundle.txt
      - name: Smoke the Hydrated Tree
        run: bun run release:smoke
      # the hydrated tree is what the payload carries, so the bundle is built from the same bytes a
      # published release hydrates. The bundle's checksum joins SHA256SUMS BELOW the payload line,
      # which is the line `hydrate` reads
      - name: Build the Managed Bundle
        env:
          DRUPFLARE_HYDRATING: '1'
        run: |
          ./node_modules/.bin/wrangler deploy --dry-run --outdir=/tmp/managed -c wrangler.managed.jsonc
          bun scripts/build-managed-bundle.ts --outdir=/tmp/managed --release="$TAG" --commit="$GITHUB_SHA" --out=/tmp/bundle
          tar -czf "dist/$BUNDLE" -C /tmp/bundle "releases/$TAG"
          cd dist
          sha256sum "$BUNDLE" >> SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Pack the Box Bundle
        run: |
          bun scripts/build-box-bundle.ts --outdir=dist/dry-run/wrangler --out=dist --version="$VERSION" --sums=dist/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS
      # AFTER the checks, not before them. A release prefix is what `hydrate` prefers over the
      # GitHub release, so publishing it early would leave a resolvable `payloads/v<version>/` for
      # a version whose checks then failed and which no release ever carried
      - name: Publish the Payload to the CDN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/publish-payload.ts --release --tag="$TAG"
      # the S3 pair makes the 4,346 objects a minute's work; without it the step falls back to
      # `wrangler r2 bulk put`, which measured 1.7 objects a second
      - name: Publish the Managed Bundle to the CDN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_KEY_ID: ${{ secrets.CLOUDFLARE_R2_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: bun scripts/publish-bundle.ts --out=/tmp/bundle --release="$TAG"
      - name: Payload to Job Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Release payload"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Asset: \`$PAYLOAD\`"
            echo "- Files: $(node -p "require('./dist/manifest.json').totals.files" 2>/dev/null || echo 'n/a')"
            echo "- Bundle: $(cat /tmp/bundle.txt 2>/dev/null || echo 'not measured')"
            echo "- Suites: run with REQUIRE_ARTIFACTS=1, so the pack-dependent specs asserted"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the Payload to the Publish Job
        uses: actions/upload-artifact@v7
        with:
          name: release-payload
          path: |
            dist/${{ env.PAYLOAD }}
            dist/${{ env.BUNDLE }}
            dist/${{ env.BOX }}
            dist/SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish the Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: payload

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract Version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Extracted Version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field; the tag would be 'vundefined'." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Retrieve Latest Tag
        id: latest_tag
        run: echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_ENV"
      - name: Collect the Payload the Previous Job Built
        uses: actions/download-artifact@v8
        with:
          name: release-payload
          path: dist
      - name: Generate Changelog
        if: ${{ github.event.inputs.changelog == '' }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: '.github/release.json'
          mode: 'HYBRID'
          fromTag: '${{ env.LATEST_TAG }}'
          toTag: '${{ github.ref_name }}'
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          name: drupflare/worker v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          body: |
            Commit: ${{ github.sha }}

            Deploying this release needs no build toolchain:

            ```sh
            git clone https://github.com/drupflare/worker.git && cd worker
            bun install
            bun run hydrate
            bunx wrangler deploy -c wrangler.jsonc
            ```

            ${{ steps.changelog.outputs.changelog || github.event.inputs.changelog }}
          files: |
            dist/drupflare-worker-${{ env.VERSION }}.tar.gz
            dist/drupflare-managed-bundle-${{ env.VERSION }}.tar.gz
            dist/drupflare-box-bundle-${{ env.VERSION }}.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ github.ref_name != 'master' }}

  deploy-path:
    name: Verify the Published Deploy Path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Read the Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "TAG=v${VERSION}${{ github.event.inputs.suffix }}"
            echo "PAYLOAD=drupflare-worker-${VERSION}.tar.gz"
            echo "BOX=drupflare-box-bundle-${VERSION}.tar.gz"
          } >> "$GITHUB_ENV"
      - name: Wait for the Asset to Be Downloadable
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${PAYLOAD}"
          for i in $(seq 1 20); do
            if curl -sfIL -o /dev/null "$URL"; then
              echo "$URL is downloadable"
              exit 0
            fi
            echo "attempt $i: not yet"
            sleep 15
          done
          echo "::error::$URL never became downloadable, so the deploy command cannot work." >&2
          exit 1
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Hydrate From the Published Payload
        # --tag, because hydrate defaults to `v${package.json version}` and the release carries the
        # dispatch SUFFIX. Without it the step above waits for `v1.0.0-rc1` and this one then looks
        # for `v1.0.0`, so every suffixed release fails here on an asset that was published fine.
        run: bun run hydrate -- --payload-only --tag="$TAG"
      - name: Bundle the Canonical Config
        run: bunx wrangler deploy --dry-run --outdir=/tmp/deploy-path -c wrangler.jsonc
      - name: Bundle the Managed Config
        run: bunx wrangler deploy --dry-run --outdir=/tmp/deploy-path-managed -c wrangler.managed.jsonc
      - name: Check the Box Bundle as a Box Would Fetch It
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          curl -sfL -o /tmp/SHA256SUMS "$BASE/SHA256SUMS"
          EXPECTED=$(grep -F "  $BOX" /tmp/SHA256SUMS | cut -d ' ' -f 1)
          test -n "$EXPECTED" || { echo "::error::SHA256SUMS has no line for $BOX." >&2; exit 1; }
          curl -sfL -o /tmp/box.tar.gz "$BASE/$BOX"
          ACTUAL=$(sha256sum /tmp/box.tar.gz | cut -d ' ' -f 1)
          test "$EXPECTED" = "$ACTUAL" || { echo "::error::$BOX hashes to $ACTUAL, the release sums say $EXPECTED." >&2; exit 1; }
          tar -tzf /tmp/box.tar.gz > /tmp/box.list
          grep -qx 'site.js' /tmp/box.list || { echo "::error::$BOX has no site.js at its root." >&2; exit 1; }
          grep -qx 'assets.manifest' /tmp/box.list || { echo "::error::$BOX has no assets.manifest at its root." >&2; exit 1; }
          grep -qx 'box.vars' /tmp/box.list || { echo "::error::$BOX has no box.vars at its root." >&2; exit 1; }
          grep -qx 'assets/drupal-pf/core.pf.bin' /tmp/box.list || { echo "::error::$BOX has no asset pack." >&2; exit 1; }
          if grep -q '^assets/bootimage/' /tmp/box.list; then echo "::error::$BOX carries the boot image." >&2; exit 1; fi
          echo "$BOX matches its sum and carries site.js, the asset manifest, the vars and the asset pack"
      - name: Deploy Path to Job Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Published deploy path"
            echo
            echo "The three commands the README gives a new user, against the release just cut:"
            echo
            echo '```sh'
            echo "bun install"
            echo "bun run hydrate"
            echo "bunx wrangler deploy -c wrangler.jsonc"
            echo '```'
            echo
            echo "Hydrated with \`--payload-only\`. A bare \`hydrate\` falls back to a source"
            echo "build when the asset is unreachable, so it would pass here having tested"
            echo "nothing about the published release. The README Deploy button runs the bare"
            echo "form through \`npm run build\`, and that fallback needs a PHP toolchain the"
            echo "Cloudflare build container does not have."
            echo
            echo "The managed config, \`wrangler.managed.jsonc\`, is bundled in the step before this"
            echo "one. It adds the R2 and \`send_email\` bindings the control plane provisions."
            echo
            echo "The canonical bundle is also the box bundle, \`$BOX\`: the step above fetched it"
            echo "from the release and checked it against \`SHA256SUMS\`."
          } >> "$GITHUB_STEP_SUMMARY"
