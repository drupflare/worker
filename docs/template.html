<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title><!-- title --></title>
		<meta
			name="description"
			content="<!-- description -->"
		/>
		<link
			rel="icon"
			href="drupflare.ico"
		/>
		<meta
			property="og:title"
			content="<!-- title -->"
		/>
		<meta
			property="og:description"
			content="<!-- description -->"
		/>
		<meta
			property="og:image"
			content="https://docs.drupflare.com/drupflare.png"
		/>
		<style>
			:root {
				color-scheme: light dark;
				--fg: #1a1510;
				--muted: #6a5f52;
				--bg: #fffdfa;
				--card: #ffffff;
				--line: #ece3d8;
				--accent: #c2540a;
				--accent-strong: #f07a1a;
				--glow: color-mix(in oklab, #f07a1a 18%, transparent);
				--code-bg: #f8f2ea;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--fg: #f3ede5;
					--muted: #b0a494;
					--bg: #100d09;
					--card: #181410;
					--line: #2c251c;
					--accent: #ff9a3c;
					--accent-strong: #ff8a1f;
					--glow: color-mix(in oklab, #ff8a1f 22%, transparent);
					--code-bg: #1d1812;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 0 1.5rem 6rem;
				background:
					radial-gradient(60rem 30rem at 50% -10rem, var(--glow), transparent 70%),
					var(--bg);
				color: var(--fg);
				font:
					16px/1.7 ui-sans-serif,
					system-ui,
					-apple-system,
					Segoe UI,
					Roboto,
					sans-serif;
			}
			main,
			nav .bar,
			footer {
				max-width: 52rem;
				margin: 0 auto;
			}
			nav {
				margin: 0 -1.5rem 3rem;
				padding: 0.75rem 1.5rem;
				border-bottom: 1px solid var(--line);
			}
			nav .bar {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.25rem 1.25rem;
			}
			nav .brand {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				margin-right: auto;
				font-weight: 700;
				letter-spacing: -0.01em;
			}
			nav .brand img {
				width: 1.75rem;
				height: 1.75rem;
			}
			nav a {
				color: var(--muted);
				font-size: 0.925rem;
				text-decoration: none;
			}
			nav a:hover,
			nav a[aria-current] {
				color: var(--accent);
			}
			nav a.brand {
				color: var(--fg);
				font-size: 1.05rem;
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 2.5rem;
				letter-spacing: -0.03em;
			}
			.badges {
				display: flex;
				flex-wrap: wrap;
				gap: 0.4rem;
				margin: 0 0 2rem;
			}
			.badges img {
				vertical-align: middle;
			}
			.links {
				display: grid;
				gap: 0.85rem;
				grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
				margin: 0 0 3rem;
			}
			a.card {
				display: block;
				padding: 1rem 1.25rem;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
				background: var(--card);
				color: inherit;
				text-decoration: none;
				transition:
					border-color 0.15s,
					box-shadow 0.15s;
			}
			a.card:hover {
				border-color: var(--accent-strong);
				box-shadow: 0 0 36px -10px var(--glow);
			}
			a.card strong {
				display: block;
				font-size: 1.02rem;
			}
			a.card span {
				color: var(--muted);
				font-size: 0.875rem;
				line-height: 1.5;
			}

			.readme h1 {
				margin: 0 0 1.25rem;
			}
			.readme h2 {
				margin: 3rem 0 1rem;
				padding-bottom: 0.4rem;
				border-bottom: 1px solid var(--line);
				font-size: 1.55rem;
				letter-spacing: -0.01em;
			}
			.readme h3 {
				margin: 2rem 0 0.75rem;
				font-size: 1.2rem;
			}
			.readme a {
				color: var(--accent);
				text-underline-offset: 0.2em;
			}
			.readme hr {
				margin: 3rem 0;
				border: 0;
				border-top: 1px solid var(--line);
			}
			.readme blockquote {
				margin: 1.5rem 0;
				padding: 0.25rem 0 0.25rem 1.25rem;
				border-left: 3px solid var(--accent-strong);
				color: var(--muted);
			}
			.readme ul,
			.readme ol {
				padding-left: 1.4rem;
			}
			.readme li {
				margin: 0.35rem 0;
			}
			.readme li::marker {
				color: var(--accent-strong);
			}
			.readme code {
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			}
			.readme :not(pre) > code {
				padding: 0.15em 0.4em;
				border-radius: 0.35rem;
				background: var(--code-bg);
				font-size: 0.85em;
				overflow-wrap: anywhere;
			}
			.readme pre {
				margin: 1.25rem 0;
				padding: 1rem 1.25rem;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
				overflow-x: auto;
				background: var(--code-bg);
				font-size: 0.85rem;
				line-height: 1.6;
			}
			.readme pre code {
				display: block;
			}

			.readme .shiki,
			.readme .shiki span {
				color: var(--shiki-light);
				background-color: var(--shiki-light-bg);
			}
			@media (prefers-color-scheme: dark) {
				.readme .shiki,
				.readme .shiki span {
					color: var(--shiki-dark);
					background-color: var(--shiki-dark-bg);
				}
			}

			.readme .table {
				overflow-x: auto;
				margin: 1.25rem 0;
				border: 1px solid var(--line);
				border-radius: 0.8rem;
			}
			.readme table {
				width: 100%;
				border-collapse: collapse;
				font-size: 0.925rem;
			}
			.readme th,
			.readme td {
				padding: 0.55rem 0.9rem;
				border-bottom: 1px solid var(--line);
				text-align: left;
				vertical-align: top;
			}
			.readme th {
				background: var(--code-bg);
				font-weight: 600;
				white-space: nowrap;
			}
			.readme tbody tr:last-child td {
				border-bottom: 0;
			}
			.readme p img {
				max-width: 100%;
				vertical-align: middle;
			}

			footer {
				margin-top: 4rem;
				padding-top: 1.5rem;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 0.9rem;
			}
			footer a {
				color: inherit;
			}
		</style>
	</head>
	<body>
		<nav>
			<div class="bar">
				<a
					class="brand"
					href="index.html"
				>
					<img
						src="drupflare_128.png"
						alt=""
					/>
					Drupflare
				</a>
				<!-- nav -->
			</div>
		</nav>
		<main>
			<!-- hero -->
			<div class="readme">
				<!-- readme -->
			</div>
		</main>
		<footer>
			<a href="https://github.com/drupflare/worker">github.com/drupflare/worker</a>
		</footer>
	</body>
</html>
