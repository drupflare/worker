name: Check Out the Siblings
description: Checks out drupflare, rom and stream-http at their latest pushed code, or at the versions composer.lock pins when pin is true.

inputs:
  pin:
    description: 'Check out the tags composer.lock pins, which is what a release builds from'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Resolve the Sibling Refs
      id: refs
      shell: bash
      env:
        PIN: ${{ inputs.pin }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        for pkg in drupflare rom stream-http; do
          if [ "$PIN" = "true" ]; then
            ref="$(jq -r --arg n "drupflare/$pkg" \
              '.packages[] | select(.name == $n) | .version' composer.lock)"
            if [ -z "$ref" ] || [ "$ref" = "null" ]; then
              echo "::error::composer.lock does not pin drupflare/$pkg" >&2
              exit 1
            fi
          elif git ls-remote --exit-code --heads "https://github.com/drupflare/$pkg.git" "refs/heads/$BRANCH" > /dev/null 2>&1; then
            ref="$BRANCH"
          else
            ref=""
          fi
          echo "$pkg=$ref" >> "$GITHUB_OUTPUT"
          echo "drupflare/$pkg -> ${ref:-default branch}"
        done
    - uses: actions/checkout@v7
      with:
        repository: drupflare/stream-http
        path: .siblings/stream-http
        ref: ${{ steps.refs.outputs.stream-http }}
    - uses: actions/checkout@v7
      with:
        repository: drupflare/drupflare
        path: .siblings/drupflare
        ref: ${{ steps.refs.outputs.drupflare }}
    - uses: actions/checkout@v7
      with:
        repository: drupflare/rom
        path: .siblings/rom
        ref: ${{ steps.refs.outputs.rom }}
