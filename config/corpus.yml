    shape: module
    core: '^10 || ^11'
    install: modify
    modules: [entity_reference_integrity]
    checks: [/admin/reports/entity-reference-integrity]
    notes:
      install: >-
        upstream defect: the routing file names its controller with doubled backslashes inside a
        single-quoted YAML string, and native PHP 8.5 with the same Composer autoloader refuses the
        class identically
    assessment: runs
    needs: []
