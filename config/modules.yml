  earth-app/strata:
    needs: []
    why: 'backups and instant rollback over S3-compatible storage. Encryption runs on the sodium_* functions the sodium stand-in supplies, and no store is reached in any gate here'
    lift: 'a store the strata_s3 submodule can reach from the Worker. No gate here has a store'
    verified: enabled against a real site; its key maker and engine services, `strata.settings` and
      `strata.webhooks` config and seven settings routes appear and were absent before. Its own cipher
      seals and opens a frame under a key `KeyMaker` created, the sealed bytes differ from the
      plaintext, six tampered or mismatched opens are refused, and a frame sealed by native libsodium
      matches byte for byte. Not asserted - no store is configured, so no frame is written to one.
      Its `strata_sodium` status row reads Available, because `extension_loaded('sodium')` is true
      here, and `strata_storage` reads Local, not usable without a store
