name: drupflare-worker

services:
  greenmail:
    image: greenmail/standalone:2.1.13@sha256:3df66b7edd01c8a301343ca5e3601d8674760d4708655573560c24745e624fb2
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=drupflare:drupflarepass@localhost -Dgreenmail.verbose'
    ports:
      - '127.0.0.1:3025:3025'
      - '127.0.0.1:3465:3465'
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/api/service/readiness || exit 1']
      interval: 3s
      timeout: 5s
      retries: 40

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ['redis-server', '--requirepass', 'testpass']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'testpass', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  gitea:
    image: gitea/gitea:1.27.2@sha256:d20286ca2b2e170fdf628e7231b8a31a3220ade39ff462b55041d43d1fc757dd
    environment:
      USER_UID: '1000'
      USER_GID: '1000'
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: 'http://127.0.0.1:3300/'
      GITEA__server__HTTP_PORT: '3000'
      GITEA__server__OFFLINE_MODE: 'true'
      GITEA__server__DISABLE_SSH: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__webhook__ALLOWED_HOST_LIST: '*'
      GITEA__log__LEVEL: 'Warn'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3300:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/healthz || exit 1']
      interval: 3s
      timeout: 5s
      retries: 40

  forgejo:
    image: codeberg.org/forgejo/forgejo:13@sha256:d05b9e587f02a746784d42c815c486b1d4f138646128f990a841833f513fe088
    environment:
      USER_UID: '1000'
      USER_GID: '1000'
      FORGEJO__security__INSTALL_LOCK: 'true'
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: 'http://127.0.0.1:3400/'
      FORGEJO__server__HTTP_PORT: '3000'
      FORGEJO__server__OFFLINE_MODE: 'true'
      FORGEJO__server__DISABLE_SSH: 'true'
      FORGEJO__service__DISABLE_REGISTRATION: 'true'
      FORGEJO__webhook__ALLOWED_HOST_LIST: '*'
      FORGEJO__log__LEVEL: 'Warn'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3400:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/healthz || exit 1']
      interval: 3s
      timeout: 5s
      retries: 40

  gitlab:
    profiles: ['heavy']
    image: gitlab/gitlab-ce@sha256:f63df4c43029fe91db370609c0b40a1e3585cebd06e3e9637d93a9a3030eb86e
    shm_size: '256m'
    environment:
      GITLAB_ROOT_PASSWORD: 'drupflare-rig-password'
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://127.0.0.1:3500'
        nginx['listen_port'] = 3500
        nginx['listen_https'] = false
        puma['worker_processes'] = 0
        sidekiq['max_concurrency'] = 5
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        registry['enable'] = false
        gitlab_pages['enable'] = false
        gitlab_kas['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['initial_root_password'] = 'drupflare-rig-password'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3500:3500'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3500/users/sign_in || exit 1']
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 240s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
    command: ['start-dev', '--import-realm', '--http-port=8081']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: 'http://127.0.0.1:8081'
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_LOG_LEVEL: 'warn'
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/drupflare-realm.json:ro
    tmpfs:
      - /tmp
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: l\r\nConnection: close\r\n\r\n" >&3 && grep -q UP <&3'
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  syslog:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command:
      - sh
      - -c
      - 'apk add --no-cache socat >/dev/null && : > /tmp/syslog.log && (socat -u TCP-LISTEN:5514,fork,reuseaddr OPEN:/tmp/syslog.log,append &) && exec socat TCP-LISTEN:5515,fork,reuseaddr SYSTEM:"cat /tmp/syslog.log"'
    ports:
      - '127.0.0.1:5514:5514'
      - '127.0.0.1:5515:5515'
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '5515']
      interval: 2s
      timeout: 2s
      retries: 30
