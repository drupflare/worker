cron:
  known:
    - announcements_feed
    - dblog
    - file
    - layout_builder
    - system
    - update
    - drupflare
  policy:
    update:
      run: true
    announcements_feed:
      run: true
    system:
      run: true
    dblog:
      run: false
      reason: superseded by the gc:watchdog SQL pass
    file:
      run: true
    layout_builder:
      run: true
    drupflare:
      run: true
modules:
  drupal/access_unpublished:
    needs: []
    why: a token table and an entity access hook, both local. Page cache and per-request state are
      what decide whether a token URL stays private
    verified: enabled against a real site; `access_token` and its two services appeared, none of
      it before. An unpublished node answered an anonymous visitor 403 with no token and 200 with
      its `auHash` token, and a wrong token 403. The visitor after the tokened one got 200 as well,
      which is how this found a runtime defect, not a module bug. `TokenGetter` keeps the token on
      a service that lives as long as the interpreter, and `RequestResetter` now clears it, so the
      same sequence answers 403. Not asserted. Token expiry, the settings form, or any role other
      than anonymous
  drupal/address:
    needs: []
    why: a field type over commerceguys/addressing, whose address formats ship as JSON in the package. The country repository is a file read rather than a service call
    verified: enabled against a real site; the `address`, `address_country` and `address_zone` field
      types are registered and `address.country_repository`, `address.address_format_repository` and
      `address.subdivision_repository` resolve. None of the three is in the container beforehand
  drupal/admin_toolbar:
    needs: []
    why: menu rendering only
    verified: enabled against a real site in the workers lane; its own routes appear in the `router`
      table after the install-triggered rebuild
    shipping: true
  drupal/backup_migrate:
    needs:
      - cron
    why: schedules are drained by cron, and a backup is a read of the database plus a write to a
      destination. A remote destination is outbound per destination, not per module
    lift:
      'none for the schedules; the alarm drains them. Sizing is the open question rather than the
      capability: a full backup as one record meets the 2,199,995-byte ceiling, so a destination
      here has to chunk'
    verified:
      enabled against a real site; it installed four config entity types and six default source
      and destination entities (`default_db`, `entire_site`, the two file destinations and a daily
      schedule), and 24 routes
  drupal/better_exposed_filters:
    needs: []
    why: views exposed-filter widgets; three plugin managers over local view data
    verified: enabled against a real site; its three widget plugin managers and
      `better_exposed_filters.bef_helper` are in the container afterwards and absent before
  drupal/captcha:
    needs:
      - deferrable-outbound
    why:
      the base module is local; it is the reCAPTCHA-style providers under it that verify against a
      remote endpoint inside form validation
    lift:
      '`src/ops/deferred-post.ts` plus a provider shim that queues on the first submit and reads the
      cached result on the automatic re-submit'
    verified: enabled against a real site; its schema hook created `captcha_sessions` and 8 routes
      appear in the `router` table. Its routes are named with underscores, so a dotted module-prefix
      match finds none of them
    capabilityEvidence:
      the deferred POST it needs is measured end to end in `deferred-post.spec.ts`.
      The body arrives intact, two submissions stay apart, and the queue answers with no
      second visitor. The module itself is not in the pack, so it is unexercised
  drupal/cas:
    needs:
      - blocking-outbound
    why: CAS single sign-on. Validating a service ticket is a synchronous GET to the CAS server
      from `CasValidator`, so a real login needs the same parked call openid_connect does. No login
      was driven here, only the module's own surface
    lift:
      'none. `blocking-outbound` is served by the Zend park, which the openid_connect login already
      uses. A CAS login has not been driven, so only the module surface is claimed'
    verified: enabled against a real site on 3.1.1; 23 services registered and instantiated, 7
      routes and 1 library resolved, with 1 install config object and 1 schema type present, none
      of them before the enable. One further private service has no consumer and is absent from
      the compiled container, so it is not asserted
  drupal/coffee:
    verified:
      enabled against a real site; `coffee.url_generator` resolves and `coffee.configuration` is
      installed, which is the config its command palette reads
  drupal/colorbox:
    needs: []
    why: a lightbox; a library and a field formatter
    verified:
      enabled against a real site; `colorbox.settings` is installed and its admin route is in
      the `router` table
  drupal/config_ignore:
    needs: []
    why: a config storage filter applied during import; no runtime I/O
    verified:
      enabled against a real site; `config_ignore.settings` is installed and its admin route is
      in the `router` table
  drupal/config_update:
    needs: []
    why: reverts and updates other modules' configuration against their shipped defaults
    verified: enabled against a real site on 2.0.0-alpha4; 5 services registered and instantiated
