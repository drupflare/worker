name: Class A Metrics

on:
  schedule:
    - cron: '40 4 * * *'
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Release payload to hydrate first, for the artifacts no producer here can build'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STREAM_HTTP_SRC: .siblings/stream-http/src
  DRUPFLARE_SRC: .siblings/drupflare
  ROM_SRC: .siblings/rom

jobs:
  collect:
    name: Collect and Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v7
      - name: Check Out drupflare/stream-http
        uses: actions/checkout@v7
        with:
          repository: drupflare/stream-http
          path: .siblings/stream-http
      - name: Check Out drupflare/drupflare
        uses: actions/checkout@v7
        with:
          repository: drupflare/drupflare
          path: .siblings/drupflare
      - name: Check Out drupflare/rom
        uses: actions/checkout@v7
        with:
          repository: drupflare/rom
          path: .siblings/rom
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Hydrate a Named Payload
        if: ${{ github.event.inputs.tag != '' }}
        continue-on-error: true
        run: bun run hydrate "--tag=${{ github.event.inputs.tag }}" --payload-only
      - name: Ensure the Artifacts the Collectors Read
        run: bun scripts/ensure-artifacts.ts
      - name: Collect the Metrics
        run: |
          mkdir -p dist
          bun run metrics --out=dist/metrics.json
      - name: Fetch the Baseline from the Last Passing Master Run
        id: baseline
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/measure/fetch-baseline.ts --out=baseline-run/metrics.json
      - name: Gate Against the Baseline
        id: gate
        if: ${{ !cancelled() }}
        run: |
          bun run metrics:gate --metrics=dist/metrics.json --summary=dist/metrics.md \
            --baseline-metrics=baseline-run/metrics.json \
            ${{ steps.baseline.outputs.found && '--require-baseline' || '' }}
      - name: Archive the Metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: |
            dist/metrics.json
            dist/metrics.md
          retention-days: 90
      - name: Metrics to Job Summary
        if: ${{ !cancelled() && hashFiles('dist/metrics.md') != '' }}
        run: cat dist/metrics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Reply on the Pull Request
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('dist/metrics.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file dist/metrics.md --edit-last --create-if-none
