worker_processes auto;
events { worker_connections 4096; }

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;
	access_log off;

	# a VPS behind Cloudflare would compress; leaving it off would flatter drupflare
	gzip on;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
	gzip_min_length 512;

	upstream php {
		server vps-php:9000;
		keepalive 64;
	}

	# The anonymous page cache, and its absence was a handicap on the slice that decides the
	# comparison. Without it EVERY anonymous hit crossed php-fpm into Drupal's internal page cache,
	# which is not how anyone serving real traffic deploys Drupal -- and it meant drupflare's
	# `caches.default` was being compared against the absence of a cache rather than against one.
	#
	# `inactive` is 10m against a 5m validity so an entry is re-validated rather than evicted
	# between uses; `max_size` is far above this site's working set, so nothing is evicted for room.
	fastcgi_cache_path /var/cache/nginx/drupal levels=1:2 keys_zone=drupal:64m inactive=10m
		max_size=512m;
	# the query string is part of `$request_uri` and is deliberately kept: excluding it is the usual
	# copy-paste and it would make every cache-miss workload uncacheable by construction
	fastcgi_cache_key "$scheme$request_method$host$request_uri";

	server {
		listen 80 default_server;
		root /var/www/html;
		index index.php;
		client_max_body_size 32m;

		# THE VPS ARM'S OWN SERVICE TIME, so the comparison can be symmetric. The edge arm has
		# reported `x-worker-ms` since it existed and this arm reported nothing, so the only
		# cross-arm quantity was total client time -- which on this rig charges drupflare a 0.604 ms
		# transport difference it does not cause: nginx answers on a published docker port and
		# `wrangler dev` proxies a node process in front of workerd. Measured over 3x400 interleaved
		# samples of a 284-byte static file that runs no application code on either side.
		# `$request_time` is nginx's own clock, in seconds with millisecond resolution.
		add_header X-Vps-Ms $request_time always;

		# what Drupal's own documentation describes: never cache a request carrying a session, and
		# never cache anything that is not a plain read
		set $skip_cache 0;
		if ($http_cookie ~* "SESS[a-z0-9]+|SSESS[a-z0-9]+|NO_CACHE") {
			set $skip_cache 1;
		}
		if ($request_method !~ ^(GET|HEAD)$) {
			set $skip_cache 1;
		}

		location = /favicon.ico { log_not_found off; access_log off; }
		location = /robots.txt { allow all; log_not_found off; access_log off; }

		location ~ \..*/.*\.php$ { return 403; }
		location ~ ^/sites/.*/private/ { return 403; }
		location ~ ^/sites/[^/]+/files/.*\.php$ { deny all; }
		location ~* ^/.well-known/ { allow all; }
		location ~ (^|/)\. { return 403; }

		location / {
			try_files $uri /index.php?$query_string;
		}

		location @rewrite {
			rewrite ^ /index.php;
		}

		location ~ '\.php$|^/update.php' {
			fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param PATH_INFO $fastcgi_path_info;
			fastcgi_param QUERY_STRING $query_string;
			fastcgi_intercept_errors on;
			fastcgi_pass php;
			fastcgi_read_timeout 60s;
			fastcgi_keep_conn on;

			fastcgi_cache drupal;
			# 5m matches what Drupal itself sends (`Cache-Control: max-age=300, public`), so the
			# cache does not outlive the freshness the application declares
			fastcgi_cache_valid 200 301 302 5m;
			fastcgi_cache_bypass $skip_cache;
			fastcgi_no_cache $skip_cache;
			# ONE upstream request per miss instead of one per waiting client. Without it a cold or
			# just-invalidated key lets every concurrent reader through to php-fpm at once, which is
			# the same stampede drupflare's plan tier has; leaving it off would hand our arm a win
			# the architecture did not earn
			fastcgi_cache_lock on;
			fastcgi_cache_lock_timeout 10s;
			# `Set-Cookie`, `Expires` and `Cache-Control` are deliberately NOT added to
			# `fastcgi_ignore_headers`: honouring them is what keeps a personalised response out of
			# a shared cache, and overriding them is how a misconfigured VPS serves one user's page
			# to another
			add_header X-FastCGI-Cache $upstream_cache_status always;
			# repeated here because a location with its OWN add_header discards every inherited one,
			# so the server-level directive never reached the PHP path -- which is the only path the
			# comparison cares about
			add_header X-Vps-Ms $request_time always;
		}

		location ~ ^/sites/.*/files/styles/ {
			try_files $uri @rewrite;
		}

		location ~ ^(/[a-z\-]+)?/system/files/ {
			try_files $uri /index.php?$query_string;
		}

		location ~* \.(css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|ico)$ {
			try_files $uri @rewrite;
			expires max;
			add_header Cache-Control "public, immutable";
			add_header X-Vps-Ms $request_time always;
		}
	}
}
