name: Regenerate the Shipped Lock

on:
  pull_request:
    branches: [master, ver/*, feat/*]
    paths:
      - composer.lock
      - composer.json

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate and Push
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
        env:
          DRUPFLARE_SKIP_RESTORE: '1'
      - name: Regenerate
        run: |
          bun run gen:lock
          bunx prettier --write src/ops/shipped-lock.ts
      - name: Push If Changed
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: src/ops/shipped-lock.ts
        run: |
          if git diff --quiet -- "$FILE"; then
            echo "$FILE already matches composer.lock"
            exit 0
          fi
          blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$GITHUB_HEAD_REF" --jq .sha)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
            -f message="chore: regenerate the shipped lock from composer.lock" \
            -f content="$(base64 -w0 "$FILE")" \
            -f sha="$blob" \
            -f branch="$GITHUB_HEAD_REF"
