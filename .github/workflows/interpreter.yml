name: Update the PHP Interpreter

on:
  repository_dispatch:
    types: [phasm-interpreter-published]
  workflow_dispatch:
    inputs:
      variant:
        description: 'The phasm rc name to fetch'
        type: string
        required: true
        default: long64
      php_version:
        description: 'The PHP version in the artifact filenames'
        type: string
        required: true
        default: '8.5'
      artifact_id:
        description: 'A phasm Actions artifact id. Empty takes the newest unexpired one'
        type: string
        required: false
      payload_tag:
        description: 'Release payload to hydrate from. Empty uses package.json version'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  interpreter:
    name: Fetch, Verify and Propose
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the Requested Interpreter
        env:
          EVENT: ${{ github.event_name }}
          VARIANT: ${{ github.event.client_payload.variant || inputs.variant }}
          PHP_VERSION: ${{ github.event.client_payload.php_version || inputs.php_version }}
          ARTIFACT_ID: ${{ github.event.client_payload.artifact_id || inputs.artifact_id }}
          SOURCE_RUN: ${{ github.event.client_payload.run_id }}
          SOURCE_COMMIT: ${{ github.event.client_payload.commit }}
          PAYLOAD_TAG: ${{ inputs.payload_tag }}
        run: |
          if [ -z "$VARIANT" ] || [ -z "$PHP_VERSION" ]; then
            echo "::error::the trigger named no variant or no php version" >&2
            exit 1
          fi
          PINNED="$(jq -r '.variant' interp.lock.json)"
          PINNED_PHP="$(jq -r '.phpVersion' interp.lock.json)"
          if [ "$EVENT" = 'repository_dispatch' ] &&
             { [ "$VARIANT" != "$PINNED" ] || [ "$PHP_VERSION" != "$PINNED_PHP" ]; }; then
            {
              echo "::notice::phasm published '$VARIANT' php '$PHP_VERSION'."
              echo "This repository ships '$PINNED' php '$PINNED_PHP', so nothing is proposed."
              echo "phasm builds every experiment arm and announces each one; a control arm is a"
              echo "different product, not an upgrade of this one. Adopt it explicitly with"
              echo "workflow_dispatch, which is not filtered."
            } >&2
            echo "SKIPPED=1" >> "$GITHUB_ENV"
            echo "RETIRE_STALE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$VARIANT" in
            *[!a-zA-Z0-9._-]*)
              echo "::error::variant '$VARIANT' is not a phasm rc name" >&2
              exit 1
              ;;
          esac
          case "$PHP_VERSION" in
            [0-9].[0-9]) ;;
            *) echo "::error::php version '$PHP_VERSION' is not <major>.<minor>" >&2; exit 1 ;;
          esac
          case "$ARTIFACT_ID" in
            '') ;;
            *[!0-9]*) echo "::error::artifact id '$ARTIFACT_ID' is not numeric" >&2; exit 1 ;;
          esac
          {
            echo "VARIANT=$VARIANT"
            echo "PHP_VERSION=$PHP_VERSION"
            echo "ARTIFACT_ID=$ARTIFACT_ID"
            echo "SOURCE_RUN=$SOURCE_RUN"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "PAYLOAD_TAG=$PAYLOAD_TAG"
          } >> "$GITHUB_ENV"

      - name: Retire Proposals for an Arm This Repository Does Not Ship
        if: ${{ env.RETIRE_STALE }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PINNED="$(jq -r '.variant' interp.lock.json)"
          PINNED_PHP="$(jq -r '.phpVersion' interp.lock.json)"
          KEEP="interp/${PINNED}-php${PINNED_PHP}"
          CLOSED=0
          while read -r NUMBER HEAD; do
            [ -z "$NUMBER" ] && continue
            case "$HEAD" in interp/*) ;; *) continue ;; esac
            [ "$HEAD" = "$KEEP" ] && continue
            gh pr close "$NUMBER" --delete-branch \
              --comment "Closed by the interpreter lane: this repository ships \`${PINNED}\` php \`${PINNED_PHP}\`, and one interpreter proposal is open at a time. Adopt another arm with workflow_dispatch." \
              && CLOSED=$((CLOSED + 1))
          done < <(gh pr list --state open --limit 200 --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"')
          {
            echo "## Interpreter proposals retired"
            echo
            echo "- Shipping: \`${PINNED}\` php \`${PINNED_PHP}\` (kept: \`${KEEP}\`)"
            echo "- Closed: $CLOSED"
            echo
            echo "A proposal for an arm this repository does not ship would otherwise stay open"
            echo "forever: nothing runs for that arm again, so nothing closes it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Bun
        if: ${{ !env.SKIPPED }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Install Dependencies
        if: ${{ !env.SKIPPED }}
        run: bun install --frozen-lockfile

      - name: Resolve the Release Payload
        if: ${{ !env.SKIPPED }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${PAYLOAD_TAG:-v$(jq -r .version package.json)}"
          echo "RESOLVED_TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "HAVE_PAYLOAD=1" >> "$GITHUB_ENV"
          elif [ -n "$PAYLOAD_TAG" ]; then
            echo "::error::payload_tag '$TAG' names no release on this repository" >&2
            exit 1
          else
            echo "HAVE_PAYLOAD=" >> "$GITHUB_ENV"
            {
              echo "::warning::no release '$TAG', so the bundle cannot be priced."
              echo "The interpreter is still fetched, verified and pinned; only the size"
              echo "comparison is skipped. Publish a payload with bun run release:payload."
            } >&2
          fi

      - name: Hydrate the Incumbent Tree
        if: ${{ !env.SKIPPED && env.HAVE_PAYLOAD }}
        run: |
          if [ -n "$PAYLOAD_TAG" ]; then
            set -- "--tag=$PAYLOAD_TAG"
          else
            set --
          fi
          bun run hydrate "$@"

      - name: Measure the Incumbent Bundle
        if: ${{ !env.SKIPPED && env.HAVE_PAYLOAD }}
        run: |
          bun run release:check | tee /tmp/incumbent.txt
          echo "INCUMBENT=$(tail -1 /tmp/incumbent.txt)" >> "$GITHUB_ENV"

      - name: Fetch and Pack the New Interpreter
        if: ${{ !env.SKIPPED }}
        env:
          GH_TOKEN: ${{ secrets.PHASM_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PHASM_TOKEN is unset, so phasm's artifacts API is unreachable" >&2
            exit 1
          fi
          ARGS=("$VARIANT" "$PHP_VERSION")
          if [ -n "$ARTIFACT_ID" ]; then
            ARGS+=("$ARTIFACT_ID")
          fi
          bun scripts/fetch-interpreter.ts "${ARGS[@]}" --pin | tee /tmp/fetch.txt

      - name: Price the New Bundle Against the Free Ceiling
        if: ${{ !env.SKIPPED && env.HAVE_PAYLOAD }}
        run: |
          bun run release:check | tee /tmp/bundle.txt
          echo "BUNDLE=$(tail -1 /tmp/bundle.txt)" >> "$GITHUB_ENV"

      - name: Build the Deploy Payload
        if: ${{ !env.SKIPPED && env.HAVE_PAYLOAD }}
        run: bun run release:payload | tee /tmp/payload.txt

      - name: Upload the Payload
        if: ${{ !env.SKIPPED && env.HAVE_PAYLOAD }}
        uses: actions/upload-artifact@v7
        with:
          name: drupflare-worker-payload-${{ env.VARIANT }}-php${{ env.PHP_VERSION }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/manifest.json
            interp.lock.json
          retention-days: 30
          if-no-files-found: error

      - name: Reconcile the Pin into One Pull Request
        if: ${{ !env.SKIPPED }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/interp-proposal.ts \
            "--variant=$VARIANT" \
            "--php=$PHP_VERSION" \
            "--base=$GITHUB_REF_NAME" \
            --fetch-log=/tmp/fetch.txt

      - name: Interpreter to Job Summary
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$SKIPPED" ]; then
            {
              echo "## Interpreter update skipped"
              echo
              echo "phasm published \`${VARIANT}\` php \`${PHP_VERSION}\`."
              echo "This repository ships \`$(jq -r .variant interp.lock.json)\`"
              echo "php \`$(jq -r .phpVersion interp.lock.json)\`, so no pin was proposed."
              echo
              echo "Adopt another arm with workflow_dispatch, which is not filtered."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Interpreter update"
            echo
            echo "- Variant: \`${VARIANT:-unresolved}\` php \`${PHP_VERSION:-unresolved}\`"
            echo "- Artifact: \`${ARTIFACT_ID:-newest unexpired}\`"
            echo "- Incumbent: ${INCUMBENT:-not measured}"
            echo "- Proposed: ${BUNDLE:-not measured}"
            echo "- Branch: \`${PROPOSAL_BRANCH:-not opened}\`"
            echo "- Proposal: ${PROPOSAL_PR:-none}, ${PROPOSAL_ACTION:-not reconciled}"
            echo "- Reason: ${PROPOSAL_WHY:-the reconcile step did not run}"
            echo "- Superseded: ${PROPOSAL_SUPERSEDED:-none}"
            echo
            echo '```txt'
            cat /tmp/fetch.txt 2> /dev/null || echo 'the fetch did not complete'
            echo '```'
            echo
            echo "Nothing here deploys. The payload is an artifact and the pin is a pull request."
          } >> "$GITHUB_STEP_SUMMARY"
