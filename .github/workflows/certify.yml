name: Certification

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      window_days:
        description: Days within which every registered fixture is run once
        type: number
        default: 7
      certify_paid:
        description: Also certify the fixtures that need the paid plan, on the paid account
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  STREAM_HTTP_SRC: .siblings/stream-http/src
  DRUPFLARE_SRC: .siblings/drupflare
  ROM_SRC: .siblings/rom

jobs:
  plan-certify:
    name: Plan the Certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
      window: ${{ steps.pick.outputs.window }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Fetch the History
        run: |
          set -e
          code=$(curl -sS -o history.json -w '%{http_code}' https://cdn.drupflare.com/certified/history.json)
          if [ "$code" = 404 ]; then
            echo '[]' > history.json
          elif [ "$code" != 200 ]; then
            echo "::error::the history fetch answered $code"
            exit 1
          fi
      - name: Pick Today's Fixtures
        id: pick
        env:
          CERTIFY_PAID: ${{ vars.CERTIFY_PAID || inputs.certify_paid || 'false' }}
          CERTIFY_WINDOW: ${{ inputs.window_days || vars.CERTIFY_WINDOW_DAYS || '7' }}
        run: bun scripts/e2e/certify.ts --select --history=history.json --paid="$CERTIFY_PAID" --window="$CERTIFY_WINDOW"

  certify:
    name: Certify ${{ matrix.fixture }} on ${{ matrix.plan }}
    needs: plan-certify
    if: ${{ needs.plan-certify.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan-certify.outputs.matrix) }}
    concurrency:
      group: certify-drupflare-account-${{ matrix.fixture }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      - name: Check Out the Siblings
        uses: ./.github/actions/siblings
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, iconv
      - name: Cache the Restored Interpreter
        uses: actions/cache@v6
        with:
          path: .interp
          key: interp-${{ hashFiles('cdn-manifest.json') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Drupal Version
        id: drupalver
        run: |
          version=$(bun scripts/fetch/drupal-tree.ts --print-version)
          test -n "$version" || { echo "::error::no Drupal version resolved" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Drupal Tree
        uses: actions/cache@v6
        with:
          path: drupal-src
          key: drupal-${{ steps.drupalver.outputs.version }}-${{ hashFiles('composer.lock') }}
      - name: Cache the Built Pack
        uses: actions/cache@v6
        with:
          path: |
            assets/drupal
            assets/drupal-pf
            assets/drupal-sql
            assets/core
            assets/modules
            assets/themes
            assets/prefill.json
          key: pack-${{ steps.drupalver.outputs.version }}-${{ hashFiles('scripts/pack/**', 'scripts/build/local.ts', 'scripts/patch-drupal.mjs', 'scripts/drupal/**', 'cdn-manifest.json') }}
      - name: Build the Pack From Source
        run: bun run build:local
      - name: Pack the Drupal Modules
        run: bun run assets:driver
      - name: Check Out anachron
        if: ${{ matrix.anachron }}
        uses: actions/checkout@v7
        with:
          repository: drupflare/anachron
          path: .siblings/anachron
      - name: Certify the Fixture
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ matrix.plan == 'paid' && secrets.CLOUDFLARE_ACCOUNT_ID || secrets.DRUPFLARE_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ matrix.plan == 'paid' && secrets.CLOUDFLARE_API_TOKEN || secrets.DRUPFLARE_CLOUDFLARE_API_TOKEN }}
          ANACHRON_DIR: .siblings/anachron
        run: |
          code=0
          bun scripts/e2e/certify.ts --fixture=${{ matrix.fixture }} --out=certified-records --plan=${{ matrix.plan }} ${{ matrix.anachron && '--anachron' || '' }} || code=$?
          if [ "$code" = 3 ]; then
            echo "::warning::the account had no budget left for ${{ matrix.fixture }}, so no record was written"
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
      - name: Tear Down the Throwaway
        if: ${{ always() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ matrix.plan == 'paid' && secrets.CLOUDFLARE_ACCOUNT_ID || secrets.DRUPFLARE_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ matrix.plan == 'paid' && secrets.CLOUDFLARE_API_TOKEN || secrets.DRUPFLARE_CLOUDFLARE_API_TOKEN }}
        run: bun scripts/e2e/certify.ts --teardown --fixture=${{ matrix.fixture }}
      - name: Upload the Record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: certify-${{ matrix.fixture }}
          path: certified-records/
          if-no-files-found: ignore
          retention-days: 14

  publish-certified:
    name: Publish the Certification
    needs: [plan-certify, certify]
    if: ${{ always() && !cancelled() && needs.certify.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    concurrency:
      group: certify-drupflare-account-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      - name: Check Out the Siblings
        uses: ./.github/actions/siblings
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Download the Records
        uses: actions/download-artifact@v8
        with:
          pattern: certify-*
          path: certified-records
          merge-multiple: true
      - name: Fetch the History
        run: |
          set -e
          code=$(curl -sS -o history.json -w '%{http_code}' https://cdn.drupflare.com/certified/history.json)
          if [ "$code" = 404 ]; then
            echo '[]' > history.json
          elif [ "$code" != 200 ]; then
            echo "::error::the history fetch answered $code"
            exit 1
          fi
      - name: Fold the Records
        run: bun scripts/e2e/certify.ts --aggregate --records=certified-records --history=history.json --status=status.json --window=${{ needs.plan-certify.outputs.window }}
      - name: Attest the Status
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: status.json
      - name: Publish to the CDN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ./node_modules/.bin/wrangler r2 object put drupflare-cdn/certified/history.json --file history.json --content-type application/json --remote
          ./node_modules/.bin/wrangler r2 object put drupflare-cdn/certified/status.json --file status.json --content-type application/json --remote
      - name: Status to Job Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Certification"
            echo
            node -e "const s=require('./status.json');for(const [id,f] of Object.entries(s.fixtures))console.log('- '+id+': '+f.state)" || echo "- no status file was written"
          } >> "$GITHUB_STEP_SUMMARY"
