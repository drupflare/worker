name: Freshness

on:
  push:
    branches: [master]
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  branches:
    name: Update Behind Pull Requests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Update Every Behind Branch This Repository Owns
        env:
          GH_TOKEN: ${{ secrets.BRANCH_UPDATE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
          HAVE_PUSH_TOKEN: ${{ secrets.BRANCH_UPDATE_TOKEN != '' }}
        run: |
          gh pr list --state open --base "$BASE" \
            --json number,headRefName,mergeStateStatus,isCrossRepository \
            > /tmp/prs.json
          COUNT=0
          SKIPPED=0
          while read -r NUMBER HEAD STATE CROSS; do
            [ -z "$NUMBER" ] && continue
            if [ "$CROSS" = 'true' ]; then
              echo "#$NUMBER ($HEAD) is from a fork, so this token cannot push to it"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            case "$HEAD" in
              renovate/*)
                echo "#$NUMBER ($HEAD) is rebased by renovate itself"
                SKIPPED=$((SKIPPED + 1))
                continue
                ;;
            esac
            if [ "$STATE" != 'BEHIND' ]; then
              echo "#$NUMBER ($HEAD) is $STATE, nothing to update"
              continue
            fi
            if gh pr update-branch "$NUMBER"; then
              echo "#$NUMBER ($HEAD) updated onto $BASE"
              COUNT=$((COUNT + 1))
            else
              echo "::warning::#$NUMBER ($HEAD) could not be updated onto $BASE" >&2
              SKIPPED=$((SKIPPED + 1))
            fi
          done < <(jq -r '.[] | "\(.number) \(.headRefName) \(.mergeStateStatus) \(.isCrossRepository)"' /tmp/prs.json)
          {
            echo "## Proposal branch freshness"
            echo
            echo "- Base: \`$BASE\`"
            echo "- Updated: $COUNT"
            echo "- Left alone: $SKIPPED"
            echo
            if [ "$HAVE_PUSH_TOKEN" != 'true' ]; then
              echo "Updating with the workflow token does not raise a \`synchronize\` event,"
              echo "so checks on an updated branch stay as they were and need re-running from"
              echo "the Actions tab. Set a \`BRANCH_UPDATE_TOKEN\` secret to have them start"
              echo "on their own."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  core:
    name: Compare Shipped Core Against drupal.org
    if: >-
      github.event_name != 'push' ||
      contains(toJSON(github.event.commits.*.modified), 'src/ops/shipped-lock.ts') ||
      contains(toJSON(github.event.commits.*.modified), 'scripts/qa/core-freshness.ts') ||
      contains(toJSON(github.event.commits.*.modified), '.github/workflows/freshness.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check the Release History
        id: check
        run: bun run qa:core-freshness | tee /tmp/freshness.txt
      - name: Freshness to Job Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Drupal core freshness"
            echo
            echo "Two ways to be stale: a newer release on our branch, or the branch dropped"
            echo "from \`supported_branches\`. The job fails only on a pending SECURITY release"
            echo "or an unsupported branch; a bugfix release behind is reported, not failed."
            echo
            echo "On a push this runs only when the shipped lock or this workflow changed;"
            echo "the daily schedule is what catches an upstream release nobody here touched."
            echo
            echo '```txt'
            cat /tmp/freshness.txt || echo 'no output'
            echo '```'
            echo
            echo "A code-only core patch is \`DRUPAL_VERSION=<v> bun run build:local\`. A patch"
            echo "touching a route, schema or config default also needs \`site.sqlite\` surgery,"
            echo "which nothing in the repo reproduces."
          } >> "$GITHUB_STEP_SUMMARY"
