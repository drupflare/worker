  drupal/redirect:
    needs: []
    why: a route subscriber over its own table
    verified:
      enabled against a real site; the `redirect` table exists and 11 of its routes are in the
      `router` table, so both halves of a route subscriber over its own table are present
  drupal/redis:
    needs:
      - blocking-socket
    why:
      'an external cache backend reached over a socket on every cache get. The deferred TCP tier does not lift this: a cache get has to answer inside the request that asked, and a deferred
      exchange always misses the first time. What `cfwTcp` reaches is the deferrable half: a
      publish, a counter, a write nobody blocks on. This is the one module the Zend park was built
      for, and it is `blocking-socket` rather than `blocking-outbound` because Predis speaks RESP
      over `stream_socket_client`, which a park can suspend under'
    lift:
      "The park serves it. Measured 2026-09-08 on the long64 build against the rig Redis: PHP opens
      a socket, writes and reads twice and receives `+OK|+PONG`: five parks, each performed in
      JavaScript on a later invocation and resumed into the same PHP chain. `ext/cfwpark` freezes
      the continuation at the trapped call and `src/ops/park-drive.ts` answers it. It took two
      extension fixes and both had failed silently: `cfw_park_resume` did not re-arm, so every trip
      after the first ran the real function down the refusal path; and the safety predicate floor
      was a frame belonging to the invocation that started the chain, so on a resume the walk went
      past the parked chain into reused VM stack memory, reading first as a refusal and then as
      `memory access out of bounds`. A resumed chain now relinks its root to the resuming frame,
      which is what `zend_generator_resume` does. Do not use a native PHP as the oracle.
      homebrew 8.5.7 is the HYBRID VM and this build is `ZEND_VM_KIND_CALL`; a native harness
      reported a chain failing to unwind that the wasm build unwinds correctly. Two things stay
      true: the Durable Object's own SQLite is the faster backend and the recommended one, since a
      parked get is a network round trip where SQLite is a local read, and
      `Drupal\\drupflare\\Network\\CfwTcp` still covers the deferrable half. The endpoint is the
      operator's `REDIS_URL` and never the caller's, so the traps arm only on a site that configured
      one"
    verified: 'enabled against a real site; `cache.backend.redis`, `redis.factory`,
      `redis.lock.factory`, `redis.flood.factory` and `queue.redis` all resolve afterwards and none
      before. It ships no config and creates no table, so the container is the observable: the
      same shape as facets. Its socket is answered by the Zend park: `park-interpreter.spec.ts`
      drives PHP through an open, two writes and two reads against the rig Redis and gets
      `+OK|+PONG` back, five parks each performed in JavaScript on a later invocation. The Durable
      Object own SQLite is still the faster cache backend and the recommended one, because a parked
      get is a network round trip where SQLite is a local read'
  drupal/samlauth:
    needs: []
    why: SAML sign-on against an external identity provider through onelogin/php-saml. The
