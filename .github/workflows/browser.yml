name: Browser Lane

on:
  push:
    branches: [master, ver/*, feat/*]
  pull_request:
    branches: [master, ver/*, feat/*]
  workflow_dispatch:
    inputs:
      payload_tag:
        description: 'Release payload to hydrate from. Empty uses package.json version'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  STREAM_HTTP_SRC: .siblings/stream-http/src
  DRUPFLARE_SRC: .siblings/drupflare
  ROM_SRC: .siblings/rom

jobs:
  browser:
    name: Render the Core Forms
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Check Out drupflare/stream-http
        uses: actions/checkout@v7
        with:
          repository: drupflare/stream-http
          path: .siblings/stream-http
      - name: Check Out drupflare/drupflare
        uses: actions/checkout@v7
        with:
          repository: drupflare/drupflare
          path: .siblings/drupflare
      - name: Check Out drupflare/rom
        uses: actions/checkout@v7
        with:
          repository: drupflare/rom
          path: .siblings/rom
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Restored Interpreter
        uses: actions/cache@v6
        with:
          path: .interp
          key: interp-${{ hashFiles('cdn-manifest.json') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the Release Payload
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_TAG: ${{ inputs.payload_tag }}
        run: |
          TAG="${PAYLOAD_TAG:-v$(jq -r .version package.json)}"
          echo "RESOLVED_TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "HAVE_PAYLOAD=1" >> "$GITHUB_ENV"
          elif [ -n "$PAYLOAD_TAG" ]; then
            echo "::error::payload_tag '$TAG' names no release on this repository" >&2
            exit 1
          else
            echo "HAVE_PAYLOAD=" >> "$GITHUB_ENV"
            {
              echo "::warning::no release '$TAG', so there is no pack to serve and no site to render."
              echo "assets/drupal-pf and assets/drupal-sql arrive only in a payload."
              echo "Publish one with bun run release:payload."
            } >&2
          fi

      - name: Hydrate the Checkout
        if: ${{ env.HAVE_PAYLOAD }}
        run: |
          if [ -n "${{ inputs.payload_tag }}" ]; then
            set -- "--tag=${{ inputs.payload_tag }}"
          else
            set --
          fi
          bun run hydrate "$@"

      - name: Pack the Drupal Modules
        if: ${{ env.HAVE_PAYLOAD }}
        run: bun run assets:driver

      - name: Cache the Playwright Browsers
        if: ${{ env.HAVE_PAYLOAD }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: ${{ env.HAVE_PAYLOAD }}
        run: bunx playwright install --with-deps chromium

      - name: Run the Browser Lane
        if: ${{ env.HAVE_PAYLOAD }}
        run: bun run test:browser

      - name: Upload the Playwright Report
        if: ${{ failure() && env.HAVE_PAYLOAD }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Browser Lane to Job Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Browser lane"
            echo
            if [ -n "$HAVE_PAYLOAD" ]; then
              echo "Hydrated from \`$RESOLVED_TAG\` and rendered the core forms in chromium."
              echo "A console error on any page fails the lane; the vitest e2e project cannot see one."
            else
              echo "DID NOT RUN: no release at \`$RESOLVED_TAG\`."
              echo "This lane boots a real worker and needs \`assets/drupal-pf\` and"
              echo "\`assets/drupal-sql\`, which a clean checkout cannot build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
