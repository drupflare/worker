name: Class A Metrics

on:
  schedule:
    - cron: '40 4 * * *'
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: 'Release tag to hydrate; blank uses the tag for package.json version'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STREAM_HTTP_SRC: .siblings/stream-http/src
  DRUPFLARE_SRC: .siblings/drupflare
  ROM_SRC: .siblings/rom

jobs:
  collect:
    name: Collect and Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - name: Check Out drupflare/stream-http
        uses: actions/checkout@v7
        with:
          repository: drupflare/stream-http
          path: .siblings/stream-http
      - name: Check Out drupflare/drupflare
        uses: actions/checkout@v7
        with:
          repository: drupflare/drupflare
          path: .siblings/drupflare
      - name: Check Out drupflare/rom
        uses: actions/checkout@v7
        with:
          repository: drupflare/rom
          path: .siblings/rom
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Pack the Drupal Modules
        run: bun run assets:driver
      - name: Hydrate the Release Payload
        id: hydrate
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            bun run hydrate "--tag=$RELEASE_TAG"
          else
            bun run hydrate
          fi
      - name: Collect the Metrics
        run: |
          mkdir -p dist
          bun run metrics --out=dist/metrics.json
      - name: Gate Against the Baseline
        id: gate
        if: ${{ !cancelled() }}
        run: bun run metrics:gate --metrics=dist/metrics.json --summary=dist/metrics.md
      - name: Archive the Metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: |
            dist/metrics.json
            dist/metrics.md
          retention-days: 90
      - name: Metrics to Job Summary
        if: ${{ !cancelled() && hashFiles('dist/metrics.md') != '' }}
        run: cat dist/metrics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Reply on the Pull Request
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('dist/metrics.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file dist/metrics.md --edit-last --create-if-none
      - name: Report a Failed Hydrate
        if: ${{ !cancelled() && steps.hydrate.outcome == 'failure' }}
        run: |
          {
            echo "### Payload Not Hydrated"
            echo
            echo "The bundle, index audit and pack shape are reported as not collected above."
            echo "Build the payload on the machine that has \`vendor/\` and"
            echo "\`assets/drupal/site.sqlite\`, attach it to the release, and re-run:"
            echo
            echo '```sh'
            echo "bun run release:payload"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
