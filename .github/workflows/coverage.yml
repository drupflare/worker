name: Check Test Coverage

on:
  push:
    branches: [master, ver/*, feat/*]
  pull_request:
    branches: [master, ver/*, feat/*]

env:
  STREAM_HTTP_SRC: .siblings/stream-http/src
  DRUPFLARE_SRC: .siblings/drupflare
  ROM_SRC: .siblings/rom

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Check Out the Locked Siblings
        uses: ./.github/actions/siblings
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Cache the Restored Interpreter
        uses: actions/cache@v6
        with:
          path: .interp
          key: interp-${{ hashFiles('cdn-manifest.json') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Drupal Version
        id: drupalver
        run: |
          version=$(bun scripts/fetch-drupal-tree.ts --print-version)
          test -n "$version" || { echo "::error::no Drupal version resolved" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Drupal Tree
        uses: actions/cache@v6
        with:
          path: drupal-src
          key: drupal-${{ steps.drupalver.outputs.version }}
      - name: Fetch Drupal Tree
        run: bun run fetch:drupal
      - name: Pack the Drupal Modules
        run: bun run assets:driver
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, iconv
          coverage: none
      # `./node_modules/.bin/vitest`, NOT `bunx vitest`. bunx resolves from the REGISTRY when the
      # name is not already a local binary in its cache, so it fetched vitest@5.0.0 while the
      # lockfile pins 4.1.11 -- and `@cloudflare/vitest-pool-workers` supports `^4.1.0` only. The
      # pool then failed to start for every spec file with `SyntaxError: Unexpected identifier
      # 'file'`, which reads as a broken worker rather than as a wrong vitest.
      - name: Run Tests (workers)
        run: ./node_modules/.bin/vitest run --project=workers --reporter=default --reporter=junit --outputFile=test-report.workers.junit.xml
      - name: Run Tests (node)
        if: ${{ !cancelled() }}
        run: ./node_modules/.bin/vitest run --project=node --reporter=default --reporter=junit --outputFile=test-report.node.junit.xml
      - name: Upload Test Results to Codecov (workers)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          report_type: test_results
          flags: workers
          disable_search: true
          files: test-report.workers.junit.xml
      - name: Upload Test Results to Codecov (node)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          report_type: test_results
          flags: node
          disable_search: true
          files: test-report.node.junit.xml

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Check Out the Locked Siblings
        uses: ./.github/actions/siblings
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Restored Interpreter
        uses: actions/cache@v6
        with:
          path: .interp
          key: interp-${{ hashFiles('cdn-manifest.json') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Resolve Drupal Version
        id: drupalver
        run: |
          version=$(bun scripts/fetch-drupal-tree.ts --print-version)
          test -n "$version" || { echo "::error::no Drupal version resolved" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Drupal Tree
        uses: actions/cache@v6
        with:
          path: drupal-src
          key: drupal-${{ steps.drupalver.outputs.version }}
      - name: Fetch Drupal Tree
        run: bun run fetch:drupal
      - name: Pack the Drupal Modules
        run: bun run assets:driver
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring, iconv
          coverage: none
      - name: Run Tests with Coverage
        run: bun run test:coverage
      - name: Upload Coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          report_type: coverage
          flags: coverage
          disable_search: true
          files: coverage/lcov.info
      - name: Archive Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
