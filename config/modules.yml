  drupal/openid_connect:
    needs:
      - blocking-outbound
    why:
      'the authorization-code exchange POSTs to the identity provider token endpoint and must have
      the answer before it can finish the login response. Unlike a search query there is no partial
      answer to render, and unlike a Redis get it cannot be retried later: the code is single use,
      so the deferred tier delivers the answer to a request that can no longer use it. That is the
      whole reason `blocking-outbound` and `blocking-socket` are two capabilities rather than one'
    lift: >-
      The module's own client runs. Measured 2026-09-08 against the rig Keycloak, a real
      authorization code was exchanged by `OpenIDConnectClientBase::retrieveTokens()` inside the
      callback request, followed by its userinfo GET. Two parked HTTP calls ran in one render, each
      performed in JavaScript while PHP was frozen mid-call. `externalauth` then wrote
      `openid_connect.keycloak` into `authmap` against the `sub` of the id_token and opened a
      session. `park-oidc.spec.ts` is the assertion. The control beside it is the pre-fix reading:
      the deferred transport answered `is not in the fetch cache; queued for the next drain`, with
      no row and no account.


      The frame that blocked it: `call_user_func_array` normally leaves no frame at all.
      `zend_compile_func_cufa` rewrites it to `ZEND_INIT_USER_CALL`, but only when the compiler has
      resolved the name. An unqualified call inside a namespace compiles to
      `ZEND_INIT_NS_FCALL_BY_NAME` and resolves at runtime, so the frame is real in every namespaced
      file, which is all of Drupal, and absent in the global namespace, where the earlier harnesses
      were written. `park_flatten()` in `ext/cfwpark` splices such a frame out of the parked chain.
      `array_map` and `usort` stay refused, which is the control.


      The host's own `/oidc` route still works, so a site gets provider login whether or not this
      module is enabled. It is a fallback for a site that configured nothing. It does not replace one
      that configured this.
    verified: "enabled against a real site on both branches, one row each;
      `plugin.manager.openid_connect_client`, `openid_connect.claims` and
      `openid_connect.state_token` resolve and the `generic` client plugin is registered, none of
      it before. 8.x-1.6, the locked branch, adds `openid_connect.settings.generic` and three
      routes. 3.0.0-alpha9, which 28,700 of the module's 36,179 sites run, adds the
      `openid_connect_client` config entity type and thirteen routes; its row runs in a build that
      carries that branch. The login below was driven through that entity type, so it ran on a
      branch that has one and not on 8.x-1.6. Its own client then completed a login: a real
      authorization code from the rig Keycloak, exchanged by
      `OpenIDConnectClientBase::retrieveTokens()` inside the callback request and followed by its
      userinfo GET, after which `externalauth` wrote `openid_connect.keycloak` into `authmap`
      against the id_token's `sub` and opened a session for the account it created. Both outbound
      calls went through the Zend park, so each was performed in JavaScript while PHP was frozen
      mid-call. The control is the same run on the interpreter before `park_flatten()`: the deferred
      transport answered `is not in the fetch cache`, no row and no account. The same run then
      logged that account out through Drupal's `/user/logout` route with the session cookie the
      login issued. Before the logout that cookie authenticated (`/user` redirected to `/user/2`,
      one `sessions` row); the module answered with a redirect to Keycloak's end_session endpoint
      carrying the id_token as `id_token_hint`; afterwards the account was anonymous, the
      `sessions` row was gone and `/user` redirected to the login page. Keycloak's own session
      answered `prompt=none` with a code before the end_session call and `login_required` after
      it. With the logout request removed the run fails at the end_session assertion"
    collides: []
    require: 'drupal/openid_connect:^3.0@alpha'
